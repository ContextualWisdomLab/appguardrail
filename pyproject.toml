[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesec"
version = "0.1.0"
description = "Security guardrails for vibe-coded apps."
authors = [
    {name = "VibeSec Contributors"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0"
]

[project.scripts]
vibesec = "scanner.cli.vibesec:main"

[tool.setuptools.package-data]
"scanner" = ["rules/*.yml"]
