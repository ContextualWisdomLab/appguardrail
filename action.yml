name: "AppGuardrail"
description: "Security scan for AI-built apps — SARIF code scanning, inline PR annotations, and a deploy gate."
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory or file to scan."
    required: false
    default: "."
  sarif:
    description: "Path to write the SARIF report."
    required: false
    default: "appguardrail.sarif"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning (needs security-events: write)."
    required: false
    default: "true"
  pr-comment:
    description: "Post a sticky findings comment on the PR (needs pull-requests: write + GITHUB_TOKEN env)."
    required: false
    default: "true"
  fail-on-blocking:
    description: "Fail the job when deploy-blocking (CRITICAL/HIGH) findings are present."
    required: false
    default: "true"
  version:
    description: "AppGuardrail version spec for pip (e.g. '==1.2.3'). Empty = latest."
    required: false
    default: ""

outputs:
  sarif:
    description: "Path to the generated SARIF file."
    value: ${{ inputs.sarif }}
  exit-code:
    description: "Scanner exit code (1 = deploy-blocking findings present)."
    value: ${{ steps.scan.outputs.exit }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install AppGuardrail
      shell: bash
      run: python -m pip install --disable-pip-version-check "appguardrail${{ inputs.version }}"

    - name: Run AppGuardrail
      id: scan
      shell: bash
      # GITHUB_ACTIONS=true is set by the runner, so the scanner auto-emits inline
      # PR annotations and a job summary — no extra flags needed.
      run: |
        set +e
        appguardrail scan --sarif "${{ inputs.sarif }}" --findings-json appguardrail-findings.json "${{ inputs.path }}"
        code=$?
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Post PR comment
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python -m appguardrail_core.github_comment appguardrail-findings.json || true

    - name: Upload results to GitHub code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}

    - name: Enforce deploy gate
      if: ${{ inputs.fail-on-blocking == 'true' && steps.scan.outputs.exit != '0' }}
      shell: bash
      run: |
        echo "AppGuardrail found deploy-blocking findings — see the annotations above and the Security tab."
        exit 1
