rules:
  # Kotlin / Android-native source rules (.kt / .kts). AndroidManifest.xml,
  # React Native JS, and iOS plist checks live in other rule packs — this file
  # only covers Kotlin source so the packs stay disjoint. Every rule is scoped
  # to Kotlin files via paths.include and tuned for high precision.
  - id: kotlin-webview-universal-file-access
    patterns:
      - pattern-regex: '(?:allowUniversalAccessFromFileURLs|allowFileAccessFromFileURLs)\s*=\s*true'
      - pattern-regex: 'set(?:AllowUniversalAccessFromFileURLs|AllowFileAccessFromFileURLs)\s*\(\s*true\s*\)'
    message: |
      WebView is configured to let file:// pages reach other origins
      (allowUniversalAccessFromFileURLs / allowFileAccessFromFileURLs). With
      JavaScript enabled, any local file the app renders can read app-private
      files and exfiltrate them to the network. Leave these settings at their
      secure defaults (false) and load untrusted content over https only.
    severity: CRITICAL
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-200]
    owasp: [A05:2021]

  - id: kotlin-sql-injection-raw
    patterns:
      - pattern-regex: '(?:rawQuery|execSQL)\s*\(\s*"[^"\n]*(?<!\\)\$[\w{]'
      - pattern-regex: '(?:rawQuery|execSQL)\s*\(\s*"[^"\n]*"\s*\+'
    message: |
      SQLite rawQuery/execSQL is built with Kotlin string interpolation or
      concatenation. Any user-controlled value in the string makes the query
      SQL-injectable. Use the selectionArgs parameter with '?' placeholders
      (rawQuery(sql, arrayOf(value))) or Room DAO queries with bind
      parameters instead of assembling SQL by hand.
    severity: CRITICAL
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-89]
    owasp: [A03:2021]

  - id: kotlin-hardcoded-encryption-key
    patterns:
      - pattern-regex: 'SecretKeySpec\s*\(\s*"[^"\n]+"\s*\.toByteArray\('
    message: |
      SecretKeySpec is constructed from a string literal, embedding the
      encryption key in the APK. Anyone who decompiles the app recovers the
      key and can decrypt all data it protects. Generate and store keys with
      Android Keystore (KeyGenerator / KeyGenParameterSpec) so key material
      never appears in source or in the packaged binary.
    severity: CRITICAL
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-321]
    owasp: [A02:2021]

  - id: kotlin-trust-all-certs
    patterns:
      - pattern-regex: 'fun\s+checkServerTrusted\s*\([^)]*\)\s*\{\s*\}'
    message: |
      X509TrustManager.checkServerTrusted has an empty body, which accepts
      every TLS certificate and disables certificate validation entirely. Any
      network attacker can man-in-the-middle all HTTPS traffic from the app.
      Delete the custom TrustManager and rely on platform validation; for
      private CAs or pinning, declare them in networkSecurityConfig instead.
    severity: HIGH
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-295]
    owasp: [A02:2021]

  - id: kotlin-world-accessible-prefs
    patterns:
      - pattern-regex: 'MODE_WORLD_(?:READABLE|WRITEABLE)'
    message: |
      SharedPreferences or an internal file is opened with
      MODE_WORLD_READABLE / MODE_WORLD_WRITEABLE, exposing it to every other
      app on the device. These modes are deprecated and throw SecurityException
      on API 24+, but still ship as real exposure on older devices. Use
      Context.MODE_PRIVATE and share data through a ContentProvider or
      FileProvider with explicit grants.
    severity: HIGH
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-732]
    owasp: [A01:2021]

  - id: kotlin-log-sensitive-data
    patterns:
      - pattern-regex: '(?i)Log\.[deivw]\s*\(\s*[^\n]{0,100}(?<!\\)\$\{?\w*(?:password|passwd|secret|token|credential|api_?key)'
      - pattern-regex: '(?i)Log\.[deivw]\s*\(\s*[^\n]{0,100}"\s*\+\s*\w*(?:password|passwd|secret|token|credential|api_?key)'
    message: |
      android.util.Log writes a password/token/secret-named value into logcat.
      On many devices other apps, bug reports, and crash pipelines can read
      logcat, so logged credentials leak beyond the app sandbox. Remove the
      sensitive value from the log message, or log a redacted form; strip
      debug logging from release builds (e.g. R8 -assumenosideeffects).
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "**/*.kt"
        - "**/*.kts"
    cwe: [CWE-532]
    owasp: [A09:2021]
