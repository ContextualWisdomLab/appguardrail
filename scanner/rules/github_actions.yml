rules:
  # A write token plus an explicit push back to contributor-controlled branch
  # state is materially different from a reviewed release publisher. Match the
  # structure, not temporary-looking names such as `once` or `repair`.
  - id: github-actions-mutable-branch-writer
    patterns:
      - pattern-regex: '\A(?=[\s\S]*^[ \t]*(?:permissions|"permissions"|''permissions'')[ \t]*:)(?=[\s\S]*^[ \t]*(?:(?:contents|"contents"|''contents'')[ \t]*:[ \t]*(?:write|"write"|''write'')|(?:permissions|"permissions"|''permissions'')[ \t]*:[ \t]*(?:(?:write-all|"write-all"|''write-all'')|\{[^}\n]*(?:contents|"contents"|''contents'')[ \t]*:[ \t]*(?:write|"write"|''write'')[^}\n]*\}))[ \t]*(?:#.*)?$)(?:(?=[\s\S]*^[ \t]*(?![^#\n]*\b(?:echo|printf)\b[^#\n]*\bgit[ \t]+push\b)[^#\n]*\bgit[ \t]+push\b[^#\n]*(?:\\\n[ \t]*[^#\n]*)*github\.(?:head_ref|event\.pull_request\.head\.ref))|(?=[\s\S]*^[ \t]*(?P<mutable_var>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[^#\n]*github\.(?:head_ref|event\.pull_request\.head\.ref)[^#\n]*$)(?=[\s\S]*^[ \t]*(?![^#\n]*\b(?:echo|printf)\b[^#\n]*\bgit[ \t]+push\b)[^#\n]*\bgit[ \t]+push\b[^#\n]*(?:\\\n[ \t]*[^#\n]*)*HEAD:[ \t]*(?:\$(?P=mutable_var)|\$\{(?P=mutable_var)\})))[\s\S]*\Z'
    message: |
      This workflow combines repository write authority with an explicit push
      to mutable event-derived branch state. Contributor-controlled workflow
      execution must not publish changes back into the branch under review.
      Move the repair through a normal reviewed pull request or constrain a
      separately reviewed publisher to an exact trusted protected-branch or
      release contract. [OWASP A08:2021 - Software and Data Integrity Failures]
    severity: HIGH
    languages: [generic]
    prefilter: ["write", "git", "push"]
    paths:
      include:
        - .github/workflows/*.yml
        - .github/workflows/*.yaml

  # Deleting or editing workflow definitions from the workflow itself leaves
  # a separately persistent Actions registry identity and evades normal review.
  - id: github-actions-self-modifying-writer
    patterns:
      - pattern-regex: '\A(?=[\s\S]*^[ \t]*(?:permissions|"permissions"|''permissions'')[ \t]*:)(?=[\s\S]*^[ \t]*(?:(?:contents|"contents"|''contents'')[ \t]*:[ \t]*(?:write|"write"|''write'')|(?:permissions|"permissions"|''permissions'')[ \t]*:[ \t]*(?:(?:write-all|"write-all"|''write-all'')|\{[^}\n]*(?:contents|"contents"|''contents'')[ \t]*:[ \t]*(?:write|"write"|''write'')[^}\n]*\}))[ \t]*(?:#.*)?$)(?=[\s\S]*^[ \t]*(?![^#\n]*\b(?:echo|printf)\b[^#\n]*(?:\bgit[ \t]+rm\b|\brm\b|\b(?:sed|perl)\b))[^#\n]*(?:\bgit[ \t]+rm\b|\brm(?:[ \t]+-[A-Za-z]+)?\b|\b(?:sed|perl)[ \t]+(?:-[A-Za-z]*i[A-Za-z]*|--in-place)\b)[^#\n]*(?:\\\n[ \t]*[^#\n]*)*[ \t"'']\.github/workflows/)(?=[\s\S]*^[ \t]*(?![^#\n]*\b(?:echo|printf)\b[^#\n]*\bgit[ \t]+commit\b)[^#\n]*\bgit[ \t]+commit\b)(?=[\s\S]*^[ \t]*(?![^#\n]*\b(?:echo|printf)\b[^#\n]*\bgit[ \t]+push\b)[^#\n]*\bgit[ \t]+push\b)[\s\S]*\Z'
    message: |
      This write-capable workflow edits or deletes a workflow definition from
      its own execution path. Source deletion does not retire the persistent
      Actions registry identity. Use a normal reviewed branch and keep exact-ID
      registry disablement in a separate owner-approved operator step.
      [OWASP A08:2021 - Software and Data Integrity Failures]
    severity: HIGH
    languages: [generic]
    prefilter: ["write", ".github/workflows/", "commit", "git", "push"]
    paths:
      include:
        - .github/workflows/*.yml
        - .github/workflows/*.yaml

  # A repository-local SARIF upload workflow needs a pull-request entry point
  # unless PR analysis is intentionally delegated to a centrally managed
  # required workflow. Delegated workflows can opt out explicitly with the
  # top-level marker documented in the remediation below.
  # The matcher accepts compact `- uses:` steps and multi-line action steps
  # where ordinary step metadata precedes `uses`, while rejecting action-like
  # text nested inside shell `run` blocks.

  - id: github-actions-sarif-missing-pull-request-trigger
    patterns:
      - pattern-regex: '\A(?=[\s\S]*(?:^[ \t]+-[ \t]*["'']?uses["'']?[ \t]*:[ \t]*["'']?(?i:github/codeql-action/upload-sarif)@|^(?P<step_indent>[ \t]+)-[ \t]*(?![ \t]*["'']?(?:run|uses)["'']?[ \t]*:)[^\n]*\n(?:(?P=step_indent)[ \t]+(?![ \t]*["'']?run["'']?[ \t]*:)[^\n]*\n){0,8}(?P=step_indent)[ \t]+["'']?uses["'']?[ \t]*:[ \t]*["'']?(?i:github/codeql-action/upload-sarif)@))(?![\s\S]*^#[ \t]*appguardrail:[ \t]*central-code-scanning[ \t]*$)(?![\s\S]*^["'']?on["'']?[ \t]*:[ \t]*(?:(?:["'']?(?:pull_request(?:_target)?|workflow_call)\b["'']?)|\[[^#\n]*\b(?:pull_request(?:_target)?|workflow_call)\b|\{[^#\n]*\b(?:pull_request(?:_target)?|workflow_call)\b|(?:#[^\n]*)?\n(?:(?:[ \t]+[^\n]*\n)|(?:[ \t]*\n))*[ \t]+["'']?(?:pull_request(?:_target)?|workflow_call)\b["'']?[ \t]*:))[\s\S]*\Z'
    message: |
      This repository-local GitHub Actions workflow uploads SARIF but has no
      pull_request, pull_request_target, or reusable workflow_call entry point.
      Without a separate PR scanner, GitHub Code Scanning cannot provide
      comparable current-head analysis for this configuration. Prefer a
      pull_request trigger. Use pull_request_target only for trusted-base,
      metadata-only jobs that never check out or execute contributor-controlled
      code; otherwise it can expose write-scoped tokens and secrets. A reusable
      workflow must be called from a PR-triggered workflow. If organization
      policy intentionally delegates PR analysis to a central required workflow,
      verify that workflow covers this SARIF tool/category and add the exact
      top-level line `# appguardrail: central-code-scanning` at column zero.
      Keep SARIF tool/category identifiers stable across branch and PR runs.
    severity: WARNING
    languages: [generic]
    cwe: [CWE-693]
    owasp: [A05:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"

  # String inputs supplied to workflow_call or workflow_dispatch are caller-
  # controlled. GitHub expands `${{ ... }}` expressions before handing a run
  # program to its interpreter, so direct interpolation turns input bytes into
  # shell source. The matcher binds one declared string input to the same input
  # used inside an inline, literal, or folded run block. Environment-variable
  # indirection and action `with:` values remain outside this detector slice.

  - id: github-actions-workflow-input-command-injection
    patterns:
      - pattern-regex: '(?msx)^[ \t]+["\x27]?workflow_(?:call|dispatch)["\x27]?[ \t]*:(?=[\s\S]{0,6000}?^[ \t]+["\x27]?inputs["\x27]?[ \t]*:[ \t]*(?:\#[^\n]*)?\n(?:[ \t]+[^\n]*\n){0,80}?^(?P<input_indent>[ \t]+)["\x27]?(?P<input_name>[A-Za-z_][A-Za-z0-9_-]*)["\x27]?[ \t]*:[ \t]*(?:\#[^\n]*)?\n(?:(?P=input_indent)(?!-)[^\n]*\n|\n){0,8}?(?P=input_indent)[ \t]+["\x27]?type["\x27]?[ \t]*:[ \t]*["\x27]?string["\x27]?[ \t]*(?:\#[^\n]*)?$)(?:[^\n]*\n){0,400}?(?:^(?P<block_indent>[ \t]+)(?:-[ \t]+)?["\x27]?run["\x27]?[ \t]*:[ \t]*[|>][^\n]*\n(?:(?P=block_indent)[ \t]+(?![^\n]*\$\{\{[^}\n]{0,160}?\binputs[ \t]*(?:\.[ \t]*(?P=input_name)|\[[ \t]*["\x27](?P=input_name)["\x27][ \t]*\])[^}\n]{0,160}?\}\})[^\n]*\n|\n){0,79}+(?P=block_indent)[ \t]+[^\n]*\$\{\{[^}\n]{0,160}?\binputs[ \t]*(?:\.[ \t]*(?P=input_name)|\[[ \t]*["\x27](?P=input_name)["\x27][ \t]*\])[^}\n]{0,160}?\}\}[^\n]*|^[ \t]+(?:-[ \t]+)?["\x27]?run["\x27]?[ \t]*:[^\n]*\$\{\{[^}\n]{0,160}?\binputs[ \t]*(?:\.[ \t]*(?P=input_name)|\[[ \t]*["\x27](?P=input_name)["\x27][ \t]*\])[^}\n]{0,160}?\}\}[^\n]*)'
    message: |
      A caller-controlled string input from workflow_call or workflow_dispatch is
      interpolated directly into a GitHub Actions run program. Expression
      expansion happens before the shell or script interpreter runs, so quotes,
      command separators, substitutions, or newlines supplied by the caller can
      become executable code and may expose workflow secrets or repository
      credentials. Bind the expression to a step-level environment variable,
      validate it when the operation needs a restricted grammar, and reference
      the environment variable using the interpreter's native syntax. Do not use
      `${{ env.NAME }}` inside run because that is still expression interpolation.
      [CWE-78 - Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')]
      [CWE-94 - Improper Control of Generation of Code ('Code Injection')]
      [OWASP A03:2021 - Injection]
    severity: CRITICAL
    languages: [generic]
    prefilter: ["workflow_", "inputs", "string", "run", "${{"]
    cwe: [CWE-78, CWE-94]
    owasp: [A03:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
