rules:
  - id: hardcoded-supabase-service-role-key
    pattern: "SUPABASE_SERVICE_ROLE_KEY"
    message: "Hardcoded Supabase Service Role Key found. This provides full administrative database access. Use environment variables instead."
    severity: "CRITICAL"
  - id: hardcoded-stripe-secret-key
    pattern: "STRIPE_SECRET_KEY"
    message: "Hardcoded Stripe Secret Key found. This exposes your payment infrastructure. Use environment variables instead."
    severity: "CRITICAL"
  - id: generic-secret-token
    pattern: "secret_token="
    message: "Potential hardcoded secret token. Ensure this is not exposing sensitive data."
    severity: "HIGH"
