rules:
  - id: python-bearer-preflight-dns-toctou-header-mutation
    patterns:
      - pattern-regex: '(?imsx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,6000}?^(?P<bodyindent>(?P=defindent)[ \t]+)if[ \t]+not[ \t]+_is_safe_url[ \t]*\([ \t]*(?P<url>[A-Za-z_][A-Za-z0-9_]*)[ \t]*\)[ \t]*:[^\n]*\n(?:(?:^(?P=bodyindent)[ \t]+\#[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=bodyindent)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=url)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=url)\b))[^\n]*\n)*?^(?P=bodyindent)(?P<endpoint>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=url)\.rstrip[ \t]*\([^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=endpoint)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n)*?^(?P=bodyindent)(?P<req>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\((?>(?:(?=(?:[ \t]*(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b(?=[ \t]*,[ \t]*headers[ \t]*=[ \t]*\{[^\n\#}]*["\x27]Authorization["\x27][ \t]*:[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*))|\n(?P<initialargindent>[ \t]+)(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\n(?:(?:^(?P=initialargindent)(?!headers\b)(?![^\n]*["\x27]Authorization["\x27])[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=initialargindent)headers[ \t]*=[ \t]*\{(?:(?!\}).){0,1000}?["\x27]Authorization["\x27][ \t]*:[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*)))(?P<initialbearer>))?)[ \t]*(?:(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\)[ \t]*(?:\#[^\n]*)?$|\n(?P<argindent>[ \t]+)(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\n(?:(?!^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?$)[^\n]*\n){0,30}^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?$)\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b)).){0,3000}?^(?P<flowindent>(?P=bodyindent)[ \t]*)(?P<authremoval>(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*\)|(?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27][^\n]*\)|del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\])[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:elif|else|except|finally|case)\b)(?!^(?P=flowindent)(?:return|raise)\b)(?!^(?P=flowindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b)).){0,1500}?^(?P=flowindent))?(?(initialbearer)(?(authremoval)(?=)|(?!))|(?=))(?:(?P=req)\.(?:add_header|add_unredirected_header)[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*,[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*)|(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*))[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=flowindent)(?:return|raise)\b)(?!^(?P=flowindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b)).){0,1500}?(?:^(?P=flowindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=flowindent)(?P<opener>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=flowindent)(?:return|raise)\b)(?!^(?P=flowindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b)).){0,1000}?^(?P=flowindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?(?P=opener)\.open[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b)'
    message: |
      A bearer-authenticated urllib request is dispatched after a separate URL-safety
      preflight after Bearer authorization is added or restored on the live request.
      The credential-bearing dispatch can repeat DNS resolution after validation;
      connect through the already-validated address set instead.
      [CWE-367 - Time-of-check Time-of-use (TOCTOU) Race Condition]
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request, Authorization, Bearer]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]
