# AppGuardrail detector artifact: non-executable SAST signature data.
# Vulnerable source shapes below describe detection targets, not AppGuardrail runtime code.
rules:
  - id: python-auth-secret-missing-fail-open
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:async[ \t]+)?def[ \t]+(?:require|verify|check|validate)[A-Za-z0-9_]*(?:authorization|authentication|auth)[A-Za-z0-9_]*[ \t]*\((?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,1200}?\)[ \t]*(?:->[^\n:]{0,240})?:[ \t]*\n(?=(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,2500}?^[ \t]*token[ \t]*=[ \t]*(?:get_[A-Za-z0-9_]*token[ \t]*\([^\)\n]{0,240}\)|[A-Za-z_][A-Za-z0-9_.]*\.(?:api_)?token)[ \t]*(?:\#[^\n]*)?$)(?=(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,4000}?^[ \t]*if[ \t]+token[ \t]+is[ \t]+None[ \t]*:[ \t]*(?:\#[^\n]*)?\n[ \t]+return[ \t]*(?:None[ \t]*)?(?:\#[^\n]*)?$)(?=(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,6000}?^[ \t]*(?:expected|provided|authorization|auth(?:orization)?_header|header|scheme|credentials?)[A-Za-z0-9_]*[ \t]*=[^\n#]{0,240}\bBearer\b)'
    message: |
      An authentication or authorization guard treats a missing server-side
      bearer token as a bare successful return, so the protected request path
      can continue without authenticating the caller. Make authentication
      disablement an explicit development/test-only mode. In required mode,
      fail closed when the secret is unavailable (for example, refuse startup
      or readiness, or return a controlled service-unavailable denial before
      protected work begins); never use secret absence as an implicit bypass.
      [CWE-306 - Missing Authentication for Critical Function]
      [OWASP A07:2025 - Authentication Failures]
    severity: HIGH
    languages: [python]
    prefilter: ["token is None", "Bearer"]
