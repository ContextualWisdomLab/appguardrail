    message: |
      Data access occurs before authentication. Move the approved authentication
      call to the start of the protected handler and reject unauthenticated
      requests before any database, repository, store, Prisma, or Supabase call.
    severity: CRITICAL
    languages: [typescript, javascript]
    paths:
      include:
        - "**/api/**"
        - "**/routes/**"
      exclude:
        - "**/api/public/**"
        - "**/api/webhooks/**"

  - id: trusting-client-user-id
    patterns:
      - pattern: |
          $DB.$METHOD({ where: { userId: $REQ.body.userId } })
      - pattern: |
          $DB.$METHOD({ where: { userId: $REQ.query.userId } })
    message: |
      User ID is being taken directly from the request body or query string.
      An attacker can provide any user ID to access or modify another user's data.
      Use the authenticated user's ID from the session: session.user.id.
    severity: CRITICAL
    languages: [typescript, javascript]

  - id: todo-skip-auth
    patterns:
      - pattern-regex: '(?ims)(?:/\*(?:(?!\*/).){0,500}?(?:(?:todo|fixme|hack|temp|temporary)\b(?:(?!\*/).){0,50}?\b(?:auth(?:entication|orization)?|security|permission|check|protect)\b|(?:skip|bypass|disable|remove)\b(?:(?!\*/).){0,30}?\b(?:auth|authentication|authorization|security)\b|(?:mock|fake)[ \t]+(?:auth|security)\b)(?:(?!\*/).){0,500}?\*/|^[ \t]*(?://|#)[ \t]*(?:(?:todo|fixme|hack|temp|temporary)\b[^\r\n]{0,50}\b(?:auth(?:entication|orization)?|security|permission|check|protect)\b|(?:skip|bypass|disable|remove)\b[^\r\n]{0,30}\b(?:auth|authentication|authorization|security)\b|(?:mock|fake)[ \t]+(?:auth|security)\b))'
    message: |
      Comment suggests authentication or security check was intentionally skipped
      or deferred. This is a common pattern in AI-generated code. Review and ensure
      proper authentication and authorization are in place before deploying.
    severity: HIGH
    languages: [typescript, javascript, python]

  - id: mock-auth-pattern
    patterns:
      - pattern: |
          const session = { user: { id: $ID } }
      - pattern: |
          const user = { id: "test", ... }
    message: |
      Hardcoded mock session or user object detected. Ensure this is only used in
      test files and is not present in production API handlers.
    severity: HIGH
    languages: [typescript, javascript]
    paths:
      exclude:
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/__tests__/**"
        - "**/test/**"
        - "**/tests/**"
