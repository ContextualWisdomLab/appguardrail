rules:
  - id: missing-api-auth
    patterns:
      - pattern-either:
          - pattern: |
              export async function $METHOD($REQ, $RES) {
                ...
                $DB.$QUERY(...)
                ...
              }
          - pattern: |
              export async function $METHOD($REQ: $TYPE) {
                ...
                $DB.$QUERY(...)
                ...
              }
      - metavariable-regex:
          metavariable: $DB
          regex: '^(?:db|database|prisma|repository|store|supabase)(?:\.[A-Za-z_$][A-Za-z0-9_$]*)?$'
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const session = await getSession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const session = await getServerSession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const session = await auth(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const user = await requireAuth(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const user = await authenticate(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const identity = await verifySession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ, $RES) {
            ...
            const { data: { user } } = await supabase.auth.getUser(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const session = await getSession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const session = await getServerSession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const session = await auth(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const user = await requireAuth(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const user = await authenticate(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const identity = await verifySession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $METHOD($REQ: $TYPE) {
            ...
            const { data: { user } } = await supabase.auth.getUser(...)
            ...
          }
    message: |
      API route accesses data before an approved authentication boundary.
      Authenticate with a repository-approved API and result symbol before the
      first database, repository, store, Prisma, or Supabase operation.
    severity: CRITICAL
    languages: [typescript, javascript]
    paths:
      include:
        - "**/api/**"
        - "**/routes/**"
      exclude:
        - "**/api/public/**"
        - "**/api/webhooks/**"

