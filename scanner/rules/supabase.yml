rules:
  - id: hardcoded-supabase-service-role-key
    patterns:
      - pattern: '"sbp_$KEY"'
      - pattern: |
          $X = "eyJ..."
    message: |
      Possible hardcoded Supabase service role key detected.
      Service role keys grant full database access and must never be committed to source code.
      Move this value to an environment variable (e.g., SUPABASE_SERVICE_ROLE_KEY).
    severity: CRITICAL
    languages: [javascript, typescript, python]

  - id: supabase-service-role-key-in-env
    patterns:
      - pattern-regex: 'NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY\s*='
      - pattern-regex: 'NEXT_PUBLIC_.*SERVICE_ROLE.*='
    message: |
      Supabase service role key is prefixed with NEXT_PUBLIC_, which exposes it
      to the client-side JavaScript bundle. Remove the NEXT_PUBLIC_ prefix and use
      this key only in server-side code.
    severity: CRITICAL
    languages: [generic]
    paths:
      include:
        - "**/.env*"
        - "**/config/*.env*"

  - id: supabase-service-role-in-client-component
    patterns:
      - pattern: |
          import { createClient } from '@supabase/supabase-js'
          ...
          createClient($URL, process.env.SUPABASE_SERVICE_ROLE_KEY)
      - pattern: |
          createClient($URL, process.env.SUPABASE_SERVICE_ROLE_KEY!)
    message: |
      Supabase client is being created with the service role key.
      Verify this code runs only on the server side (API route, server action, or edge function).
      The service role key must never be used in client components or browser-accessible code.
    severity: HIGH
    languages: [javascript, typescript]

  - id: supabase-without-rls-check
    patterns:
      - pattern: |
          $SUPABASE.from($TABLE).select($COLS)
    message: |
      Supabase query detected. Ensure Row Level Security (RLS) is enabled on the
      table and that appropriate policies are in place. Queries without RLS can
      expose all rows to all authenticated (or unauthenticated) users.
    severity: WARNING
    languages: [javascript, typescript]

  - id: supabase-get-session-server-side
    patterns:
      - pattern: |
          $SUPABASE.auth.getSession()
    message: |
      supabase.auth.getSession() returns data from the browser's storage and does
      NOT validate the JWT signature. Use supabase.auth.getUser() on the server side,
      which validates the token against the Supabase Auth server.
    severity: HIGH
    languages: [javascript, typescript]

  - id: supabase-auth-admin-client-usage
    patterns:
      - pattern-regex: '\.auth\.admin\.[a-zA-Z]'
    message: |
      Supabase Admin auth API (auth.admin.*) detected. These methods (createUser,
      deleteUser, listUsers, generateLink, etc.) require the service role key and
      must run only server-side. Verify this file is a server route, server action,
      or edge function — never a client component.
    severity: HIGH
    languages: [javascript, typescript]
    cwe: [CWE-269]
    owasp: [A01:2021]
