rules:
  # A total poll bound is only safety evidence while its state remains monotonic.
  # Refreshing a deadline from the current clock, resetting a total counter, or
  # growing an attempt limit can prevent convergence. Deadline tightening is not
  # a reset: only reviewed mutations that can move the bound away are evidence.
  - id: github-actions-poll-bound-state-reset
    patterns:
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^    timeout-minutes[ \t]*:|^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,100}?^          (?P<dline>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*\$\(\([^\n]*\bdate\b[^\n]*\+%s[^\n]*\+[ \t]*[1-9][0-9]*[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=dline)[ \t]*=[ \t]*(?:\$\(\([^\n]*\bdate\b[^\n]*\+%s[^\n]*\+[ \t]*[1-9][0-9]*[ \t]*\)\)|\$\(\([ \t]*(?P=dline)[ \t]*\+[ \t]*[1-9][0-9]*[ \t]*\)\))[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )if[^\n]*\$(?P=dline)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12,}(?:[^#\n]*\$\([^\)\n]*\bgh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,160}?^          done\b'
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^    timeout-minutes[ \t]*:|^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,120}?^          (?P<creset>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,100}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=creset)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=creset)[ \t]*=[ \t]*\$\(\([ \t]*(?P=creset)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )if[^\n]*\$(?P=creset)\b[^\n]*-ge[^\n]*\$[A-Za-z_][A-Za-z0-9_]*\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12,}(?:[^#\n]*\$\([^\)\n]*\bgh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,160}?^          done\b'
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^    timeout-minutes[ \t]*:|^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,120}?^          (?P<gcounter>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          (?P<glimit>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=gcounter)[ \t]*=[ \t]*\$\(\([ \t]*(?P=gcounter)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=glimit)[ \t]*=[ \t]*\$\(\([ \t]*(?P=glimit)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )if[^\n]*\$(?P=gcounter)\b[^\n]*-ge[^\n]*\$(?P=glimit)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12,}(?:[^#\n]*\$\([^\)\n]*\bgh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,160}?^          done\b'
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^    timeout-minutes[ \t]*:|^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,120}?^          (?P<glimit_b>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          (?P<gcounter_b>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=gcounter_b)[ \t]*=[ \t]*\$\(\([ \t]*(?P=gcounter_b)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )(?P=glimit_b)[ \t]*=[ \t]*\$\(\([ \t]*(?P=glimit_b)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )if[^\n]*\$(?P=gcounter_b)\b[^\n]*-ge[^\n]*\$(?P=glimit_b)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12,}(?:[^#\n]*\$\([^\)\n]*\bgh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n)(?=(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,120}?^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?:(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,160}?^          done\b'
    prefilter: [while, sleep]
    message: |
      This GitHub Actions polling loop appears to have a total deadline or
      attempt bound, but the bound's state is mutated inside the same loop in
      a way that can prevent termination: a deadline is refreshed or extended,
      a total counter is reset, or a fixed attempt limit grows alongside its
      counter. Keep the deadline and limit convergent after loop entry and
      advance a total counter monotonically toward a fixed limit. Tightening a
      deadline is not a vulnerability. A positive timeout-minutes on the owning
      job is an independent hard bound.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-400]
    owasp: [A04:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
