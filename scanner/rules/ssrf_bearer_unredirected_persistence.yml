rules:
  - id: python-bearer-preflight-dns-toctou-unredirected-header-persistence
    patterns:
      - pattern-regex: '(?ims)^(?P<di>[ \t]*)(?:async[ \t]+)?def[ \t]+\w+[^\n]*:\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).){0,5000}?^(?P<bi>(?P=di)[ \t]+)if[ \t]+not[ \t]+_is_safe_url\([ \t]*(?P<u>\w+)[ \t]*\)[ \t]*:[^\n]*\n(?:^(?P=bi)[ \t]+(?:\#[^\n]*)?\n|^[ \t]*\n){0,8}^(?P=bi)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).){0,2500}?^(?P=bi)(?P<ep>\w+)[ \t]*=[ \t]*(?P=u)\.rstrip\([^\n]*\)[^\n]*\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).){0,2500}?^(?P=bi)(?P<r>\w+)[ \t]*=[ \t]*urllib\.request\.Request\((?:[ \t]*(?:url[ \t]*=[ \t]*)?(?P=ep)\b[^\n]*\)|[ \t]*\n(?:^[ \t]*\n|^(?P=bi)[ \t]+\#[^\n]*\n){0,8}^(?P=bi)[ \t]+(?:url[ \t]*=[ \t]*)?(?P=ep)\b[^\n]*\n(?:(?!^(?P=bi)\)[ \t]*(?:\#[^\n]*)?$)[^\n]*\n){0,30}^(?P=bi)\)[ \t]*(?:\#[^\n]*)?)\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).){0,2000}?^(?P<mi>(?P=bi)[ \t]*)(?P=r)\.add_unredirected_header\([ \t]*(?:\n[ \t]+)?["\x27]Authorization["\x27][ \t]*,[ \t]*(?:\n[ \t]+)?(?:f?["\x27]Bearer[ \t]+\{?\w+\}?[^\n"\x27]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*\w+)[^\n]*\)?[^\n]*\n(?:(?!^(?P=mi)(?P=r)\.remove_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=mi)(?:return|raise)\b)(?!^(?P=mi)(?P=r)[ \t]*=).){0,1200}?^(?P=mi)(?:(?P=r)\.headers\.clear\(\)|(?P=r)\.headers[ \t]*=[ \t]*\{[ \t]*\}[ \t]*(?:\#[^\n]*)?|(?P=r)\.headers\.pop\([ \t]*["\x27]Authorization["\x27][^\n]*\))[^\n]*\n(?:(?!^(?P=mi)(?P=r)\.remove_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=mi)(?:return|raise)\b)(?!^(?P=mi)(?P=r)[ \t]*=)(?!^(?P=mi)(?P=r)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=)(?!^(?P=mi)(?P=r)\.add_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=mi)(?P=r)\.add_unredirected_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=mi)(?P=r)\.headers[ \t]*=).){0,1200}?(?:^(?P=bi)[ \t]*(?:return[ \t]+|\w+[ \t]*=[ \t]*)?urllib\.request\.urlopen\([ \t]*(?:url[ \t]*=[ \t]*)?(?P=r)\b|^(?P=bi)(?P<o>\w+)[ \t]*=[ \t]*urllib\.request\.build_opener\([ \t]*SafeRedirectHandler\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=bi)(?:return|raise)\b)(?!^(?P=bi)(?P=o)[ \t]*=)(?!^(?P=bi)(?P=r)\.remove_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=bi)(?P=r)[ \t]*=)(?!^(?P=bi)(?P=r)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=)(?!^(?P=bi)(?P=r)\.add_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=bi)(?P=r)\.add_unredirected_header\([ \t]*["\x27]Authorization["\x27])(?!^(?P=bi)(?P=r)\.headers[ \t]*=)[^\n]*\n){0,40}?^(?P=bi)[ \t]*(?:return[ \t]+|\w+[ \t]*=[ \t]*)?(?P=o)\.open\([ \t]*(?:fullurl[ \t]*=[ \t]*)?(?P=r)\b)'
    message: |
      Bearer authorization stored by urllib Request.add_unredirected_header remains
      active when the ordinary headers mapping is cleared, emptied, or has its
      Authorization entry popped. A later resolver-backed dispatch after a separate
      URL safety preflight still carries the unredirected credential and can repeat
      DNS lookup unless a normal Authorization value overrides it, remove_header
      removes both stores, or the request/destination provenance is replaced.
      [CWE-367 - Time-of-check Time-of-use (TOCTOU) Race Condition]
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request, add_unredirected_header]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]
