rules:
  - id: python-bearer-preflight-dns-toctou-multiline-constructor
    patterns:
      - pattern-regex: '(?imsx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).)*?^(?P<bodyindent>(?P=defindent)[ \t]+)if[ \t]+not[ \t]+_is_safe_url[ \t]*\([ \t]*(?P<url>[A-Za-z_][A-Za-z0-9_]*)[ \t]*\)[ \t]*:[^\n]*\n(?:(?:^(?P=bodyindent)[ \t]+\#[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=bodyindent)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,2500}?^(?P=bodyindent)(?P<endpoint>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=url)\.rstrip[ \t]*\([^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,1800}?^(?P=bodyindent)(?P<req>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\((?:(?:[ \t]*(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n\#]{0,600}?headers[ \t]*=[ \t]*\{[^\n\#}]{0,500}?["\x27]Authorization["\x27][ \t]*:[ \t]*\([ \t]*(?:\#[^\n]*)?\n[ \t]*(?!\#)f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27])|(?:[ \t]*\n(?P<argindent>[ \t]+)(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\n(?:(?:^(?P=argindent)(?!headers\b)[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=argindent)headers[ \t]*=[ \t]*\{(?:(?!\}).){0,800}?["\x27]Authorization["\x27][ \t]*:[ \t]*(?:\([ \t]*(?:\#[^\n]*)?\n|(?:\#[^\n]*)?\n)[ \t]*(?!\#)f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]))(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,1800}?(?:urllib\.request\.urlopen[ \t]*\([ \t]*(?:url[ \t]*=[ \t]*)?(?P=req)\b|(?P<opener>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,800}?(?P=opener)\.open[ \t]*\([ \t]*(?:fullurl[ \t]*=[ \t]*)?(?P=req)\b)'
    message: |
      A Bearer-authenticated urllib request is dispatched after a separate URL safety
      preflight, so connection-time DNS resolution can diverge from validation. This
      companion rule covers supported multiline constructor formatting.
      [CWE-367 - Time-of-check Time-of-use Race Condition] [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]
  - id: python-bearer-preflight-dns-toctou-multiline-header-mutation
    patterns:
      - pattern-regex: '(?imsx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).)*?^(?P<bodyindent>(?P=defindent)[ \t]+)if[ \t]+not[ \t]+_is_safe_url[ \t]*\([ \t]*(?P<url>[A-Za-z_][A-Za-z0-9_]*)[ \t]*\)[ \t]*:[^\n]*\n(?:(?:^(?P=bodyindent)[ \t]+\#[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=bodyindent)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,2500}?^(?P=bodyindent)(?P<endpoint>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=url)\.rstrip[ \t]*\([^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,1800}?^(?P=bodyindent)(?P<req>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\([ \t]*(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,1200}?^(?P<mutindent>[ \t]+)(?:(?P=req)\.(?:add_header|add_unredirected_header)[ \t]*\([ \t]*(?:\#[^\n]*)?\n[ \t]*(?!\#)["\x27]Authorization["\x27][ \t]*,[ \t]*(?:\#[^\n]*)?\n[ \t]*(?!\#)f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|(?P=req)\.headers[ \t]*\[[ \t]*(?:\#[^\n]*)?\n[ \t]*(?!\#)["\x27]Authorization["\x27][ \t]*(?:\n[ \t]*)?\][ \t]*=[ \t]*(?:\([ \t]*(?:\#[^\n]*)?\n)?[ \t]*(?!\#)f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27])(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,1800}?(?:urllib\.request\.urlopen[ \t]*\([ \t]*(?:url[ \t]*=[ \t]*)?(?P=req)\b|(?P<opener>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,800}?(?P=opener)\.open[ \t]*\([ \t]*(?:fullurl[ \t]*=[ \t]*)?(?P=req)\b)'
    message: |
      A Bearer credential added to a validated urllib request is dispatched through a
      resolver-backed transport after the preflight. This companion rule covers supported
      multiline header-mutation formatting.
      [CWE-367 - Time-of-check Time-of-use Race Condition] [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]
