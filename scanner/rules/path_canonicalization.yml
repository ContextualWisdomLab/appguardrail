rules:
  - id: python-url-path-traversal-validate-before-canonicalize
    patterns:
      - pattern-regex: '(?ms)^[ \t]*(?P<path>[A-Za-z_]\w*)\s*=\s*[^\n]+\.strip\(\)\s*\n(?=(?:(?!^[ \t]*(?:async[ \t]+)?def\b).){0,1800}?(?P=path)\.startswith\(\s*["'']/["'']\s*\))(?:(?!^[ \t]*(?:async[ \t]+)?def\b)(?![^\n]*\bunquote(?:_to_bytes)?\s*\(\s*(?P=path)\s*\)).){0,2200}?\b(?P<segment>[A-Za-z_]\w*)\s+not\s+in\s+\{\s*["'']\.["'']\s*,\s*["'']\.\.["'']\s*\}\s+for\s+(?P=segment)\s+in\s+(?P=path)\.split\(\s*["'']/["'']\s*\)(?:(?!^[ \t]*(?:async[ \t]+)?def\b)(?![^\n]*\bunquote(?:_to_bytes)?\s*\(\s*(?P=path)\s*\)).){0,1000}?\breturn\s+(?P=path)\b'
      - pattern-regex: '(?ms)^[ \t]*(?P<raw>[A-Za-z_]\w*)\s*=\s*[^\n]+\.strip\(\)\s*\n(?:(?!^[ \t]*(?:async[ \t]+)?def\b).){0,400}?^[ \t]*(?P<canon>(?!(?P=raw)\b)[A-Za-z_]\w*)\s*=\s*(?P=raw)\s*\n(?=(?:(?!^[ \t]*(?:async[ \t]+)?def\b).){0,1600}?\bunquote(?:_to_bytes)?\s*\(\s*(?P=canon)\s*\))(?=(?:(?!^[ \t]*(?:async[ \t]+)?def\b).){0,2000}?(?P=canon)\.startswith\(\s*["'']/["'']\s*\))(?:(?!^[ \t]*(?:async[ \t]+)?def\b).){0,2800}?\breturn\s+(?P=raw)\b'
    message: |
      URL-like path input is checked before canonicalization, or one decoded
      representation is validated while the original percent-encoded value is
      returned. Canonicalize or decode into the representation the consumer will
      use, reject ambiguous residual encoding, validate that representation, and
      pass the same validated value onward.
      [CWE-180 - Incorrect Behavior Order: Validate Before Canonicalize]
      [CWE-22 - Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')]
      [OWASP A01:2021 - Broken Access Control]
    severity: HIGH
    languages: [python]
    prefilter: [".split(", ".startswith(", "://", "return"]
    cwe: [CWE-180, CWE-22]
    owasp: [A01:2021]
