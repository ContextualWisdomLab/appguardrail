rules:
  - id: python-url-path-traversal-validate-before-canonicalize
    patterns:
      - pattern-regex: '(?m)^[ \t]*(?P<p>\w+)\s*=\s*[^\n]+\.strip\(\)\n(?!(?:[^\n]*\n){0,64}[ \t]*(?P=p)\s*=)(?!(?:[^\n]*\n){0,64}[^\n]*\bdef\b)(?:[^\n]*\n){0,24}?[^\n]*(?P=p)\.startswith\(["'']/["'']\)(?:[^\n]*\n){0,8}?[^\n]*["'']://["''] not in (?P=p)\b(?:[^\n]*\n){0,12}?[^\n]*segment\s+not\s+in\s+\{["'']\.["''],\s*["'']\.\.["'']\}(?:[^\n]*\n){0,2}?[^\n]*for\s+segment\s+in\s+(?P=p)\.split\(["'']/["'']\)(?:[^\n]*\n){0,8}?[^\n]*return\s+(?P=p)\b'
      - pattern-regex: '(?m)^[ \t]*(?P<r>\w+)\s*=\s*[^\n]+\.strip\(\)\n(?!(?:[^\n]*\n){0,64}[ \t]*(?P=r)\s*=)(?!(?:[^\n]*\n){0,64}[^\n]*\bdef\b)(?:[^\n]*\n){0,6}?[ \t]*(?P<c>\w+)\s*=\s*(?P=r)\s*\n(?:[^\n]*\n){0,10}?[^\n]*\bunquote\(\s*(?P=c)\s*\)(?:[^\n]*\n){0,18}?[^\n]*(?P=c)\.startswith\(["'']/["'']\)(?:[^\n]*\n){0,8}?[^\n]*["'']://["''] not in (?P=c)\b(?:[^\n]*\n){0,12}?[^\n]*segment\s+not\s+in\s+\{["'']\.["''],\s*["'']\.\.["'']\}[^\n]*for\s+segment\s+in\s+(?P=c)\.split\(["'']/["'']\)(?:[^\n]*\n){0,8}?[^\n]*return\s+(?P=r)\b'
    message: |
      URL-like path input is checked before canonicalization, or one decoded
      representation is validated while the original percent-encoded value is
      returned. Canonicalize or decode into the representation the consumer will
      use, reject ambiguous residual encoding, validate that representation, and
      pass the same validated value onward.
      [CWE-180 - Incorrect Behavior Order: Validate Before Canonicalize]
      [CWE-22 - Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')]
      [OWASP A01:2021 - Broken Access Control]
    severity: HIGH
    languages: [python]
    prefilter: [".split(", ".startswith(", "://", "return"]
    cwe: [CWE-180, CWE-22]
    owasp: [A01:2021]
