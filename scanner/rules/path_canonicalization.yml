rules:
  - id: python-url-path-traversal-validate-before-canonicalize
    patterns:
      - pattern-regex: '(?ms)^[ \t]*(?P<p>[A-Za-z_]\w*)\s*=\s*[^\n]+\.strip\(\)\s*\n(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,1800}?(?P=p)\.startswith\(\s*["'']/["'']\s*\))(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,1800}?["'']://["''] not in (?P=p)\b)(?:(?!^[ \t]*(?:async\s+)?def\b)(?![^\n]*\bunquote(?:_to_bytes)?\s*\(\s*(?P=p)\s*\)).){0,2200}?\b(?P<s>[A-Za-z_]\w*)\s+not\s+in\s+\{\s*["'']\.["'']\s*,\s*["'']\.\.["'']\s*\}\s+for\s+(?P=s)\s+in\s+(?P=p)\.split\(\s*["'']/["'']\s*\)(?:(?!^[ \t]*(?:async\s+)?def\b)(?![^\n]*\bunquote(?:_to_bytes)?\s*\(\s*(?P=p)\s*\)).){0,1000}?\breturn\s+(?P=p)\b'
      - pattern-regex: '(?ms)^[ \t]*(?P<r>[A-Za-z_]\w*)\s*=\s*[^\n]+\.strip\(\)\s*\n(?:(?!^[ \t]*(?:async\s+)?def\b).){0,400}?^[ \t]*(?P<c>(?!(?P=r)\b)[A-Za-z_]\w*)\s*=\s*(?P=r)\s*\n(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,1600}?\bunquote(?:_to_bytes)?\s*\(\s*(?P=c)\s*\))(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,2000}?(?P=c)\.startswith\(\s*["'']/["'']\))(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,2000}?["'']://["''] not in (?P=c)\b)(?=(?:(?!^[ \t]*(?:async\s+)?def\b).){0,2400}?\b(?P<s>\w+) not in \{["'']\.["''], ["'']\.\.["'']\} for (?P=s) in (?P=c)\.split\(["'']/["'']\))(?:(?!^[ \t]*(?:async\s+)?def\b).){0,2800}?\breturn\s+(?P=r)\b'
    message: |
      URL-like path input is checked before canonicalization, or one decoded
      representation is validated while the original percent-encoded value is
      returned. Canonicalize or decode into the representation the consumer will
      use, reject ambiguous residual encoding, validate that representation, and
      pass the same validated value onward.
      [CWE-180 - Incorrect Behavior Order: Validate Before Canonicalize]
      [CWE-22 - Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')]
      [OWASP A01:2021 - Broken Access Control]
    severity: HIGH
    languages: [python]
    prefilter: [".split(", ".startswith(", "://", "return"]
    cwe: [CWE-180, CWE-22]
    owasp: [A01:2021]
