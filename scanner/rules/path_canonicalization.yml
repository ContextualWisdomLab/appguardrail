rules:
  - id: python-url-path-traversal-validate-before-canonicalize
    patterns:
      - pattern-regex: '(?ms)^[ \t]*(?P<p>\w+)\s*=\s*[^\n]+\.strip\(\)\n(?:(?!^[ \t]*(?P=p)\s*=|\bunquote\(\s*(?P=p)\s*\)|^[ \t]*(?:async )?def).){0,1800}?(?P=p)\.startswith\(["'']/["'']\).{0,600}?["'']://["''] not in (?P=p)\b.{0,1000}?(?P<s>\w+)\s+not\s+in\s+\{["'']\.["''],\s*["'']\.\.["'']\}\s+for\s+(?P=s)\s+in\s+(?P=p)\.split\(["'']/["'']\)(?:(?!^[ \t]*(?P=p)\s*=|\bunquote\(\s*(?P=p)\s*\)|^[ \t]*(?:async )?def).){0,700}?return\s+(?P=p)\b'
      - pattern-regex: '(?ms)^[ \t]*(?P<r>\w+)\s*=\s*[^\n]+\.strip\(\)\n.{0,400}?(?P<c>\w+)\s*=\s*(?P=r)\s*\n.{0,1200}?\bunquote\(\s*(?P=c)\s*\).{0,1800}?(?P=c)\.startswith\(["'']/["'']\).{0,600}?["'']://["''] not in (?P=c)\b.{0,1200}?(?P<s>\w+)\s+not\s+in\s+\{["'']\.["''],\s*["'']\.\.["'']\}\s+for\s+(?P=s)\s+in\s+(?P=c)\.split\(["'']/["'']\)(?:(?!^[ \t]*(?P=r)\s*=|^[ \t]*(?:async )?def).){0,700}?return\s+(?P=r)\b'
    message: |
      URL-like path input is checked before canonicalization, or one decoded
      representation is validated while the original percent-encoded value is
      returned. Canonicalize or decode into the representation the consumer will
      use, reject ambiguous residual encoding, validate that representation, and
      pass the same validated value onward.
      [CWE-180 - Incorrect Behavior Order: Validate Before Canonicalize]
      [CWE-22 - Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')]
      [OWASP A01:2021 - Broken Access Control]
    severity: HIGH
    languages: [python]
    prefilter: [".split(", ".startswith(", "://", "return"]
    cwe: [CWE-180, CWE-22]
    owasp: [A01:2021]