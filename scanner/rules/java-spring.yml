rules:
  - id: java-sql-injection-concat
    patterns:
      - pattern-regex: '(?:createQuery|createNativeQuery|prepareStatement|executeQuery|executeUpdate)\s*\(\s*"[^"\n]*"\s*\+\s*[A-Za-z_$][\w$.]*'
    message: |
      SQL/JPQL query is built by concatenating a string literal with a variable
      before being passed to createQuery/prepareStatement/executeQuery. Use
      parameterized queries (PreparedStatement placeholders or JPA named/positional
      parameters) instead of string concatenation. [CWE-89 - SQL Injection]
    severity: CRITICAL
    languages: [java]
    cwe: [CWE-89]
    owasp: [A03:2021]

  - id: java-runtime-exec-concat
    patterns:
      - pattern-regex: 'Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec\s*\(\s*"[^"\n]*"\s*\+\s*[A-Za-z_$][\w$.]*|new\s+ProcessBuilder\s*\([^)\n]*"[^"\n]*"\s*\+\s*[A-Za-z_$][\w$.]*'
    message: |
      OS command is built by concatenating a string literal with a variable and
      passed to Runtime.exec or ProcessBuilder. Pass a fixed argument vector and
      validate each argument against an allowlist instead of concatenating
      user-influenced values into the command line. [CWE-78 - OS Command Injection]
    severity: CRITICAL
    languages: [java]
    cwe: [CWE-78]
    owasp: [A03:2021]

  - id: java-xxe-unsafe-parser
    patterns:
      - pattern-regex: 'setFeature\s*\(\s*"http://xml\.org/sax/features/external-(?:general|parameter)-entities"\s*,\s*true\s*\)|setFeature\s*\(\s*"http://apache\.org/xml/features/disallow-doctype-decl"\s*,\s*false\s*\)|setProperty\s*\(\s*(?:XMLInputFactory\.SUPPORT_DTD|"javax\.xml\.stream\.supportDTD")\s*,\s*(?:true|Boolean\.TRUE)\s*\)'
    message: |
      XML parser is explicitly configured to allow external entities or DTDs
      (external-general-entities/external-parameter-entities set to true,
      disallow-doctype-decl set to false, or XMLInputFactory SUPPORT_DTD enabled).
      This enables XML External Entity (XXE) attacks. Disable DTDs and external
      entity resolution on every XML parser factory. [CWE-611 - XML External Entity]
    severity: HIGH
    languages: [java]
    cwe: [CWE-611]
    owasp: [A05:2021]

  - id: java-trustall-trustmanager
    patterns:
      - pattern-regex: '(?s)X509TrustManager\b.{0,600}?checkServerTrusted\s*\([^)]*\)[^{]{0,80}\{\s*(?://[^\n]*\s*)*\}'
    message: |
      X509TrustManager implementation has an empty checkServerTrusted body, which
      accepts every server certificate and disables TLS trust validation. Use the
      platform default trust manager or pin to an explicit trust store instead of
      a trust-all manager. [CWE-295 - Improper Certificate Validation]
    severity: HIGH
    languages: [java]
    cwe: [CWE-295]
    owasp: [A02:2021]

  - id: spring-actuator-exposed
    patterns:
      - pattern-regex: 'management\.endpoints\.web\.exposure\.include\s*[=:]\s*["'']?\*|\bexposure:\s*[\r\n]+\s*include:\s*["'']?\*'
    message: |
      Spring Boot Actuator exposes every web endpoint
      (management.endpoints.web.exposure.include=*). Endpoints such as /actuator/env,
      /actuator/heapdump, and /actuator/mappings can leak credentials and internals.
      Expose only the endpoints you need (for example health,info) and require
      authentication for the rest. [CWE-200 - Exposure of Sensitive Information]
    severity: HIGH
    languages: [generic]
    paths:
      include:
        - "**/application*.properties"
        - "**/application*.yml"
        - "**/application*.yaml"
    cwe: [CWE-200]
    owasp: [A05:2021]
