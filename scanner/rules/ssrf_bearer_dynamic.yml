rules:
  - id: python-bearer-preflight-dns-toctou-dynamic-bearer-replacement
    patterns:
      - pattern-regex: '(?imsx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,6000}?^(?P<bodyindent>(?P=defindent)[ \t]+)if[ \t]+not[ \t]+_is_safe_url[ \t]*\([ \t]*(?P<url>[A-Za-z_][A-Za-z0-9_]*)[ \t]*\)[ \t]*:[^\n]*\n(?:(?:^(?P=bodyindent)[ \t]+\#[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=bodyindent)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b).){0,2500}?^(?P=bodyindent)(?P<endpoint>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=url)\.rstrip[ \t]*\([^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=endpoint)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n){0,80}?^(?P=bodyindent)(?P<req>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\((?:[ \t]*(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\)[^\n]*\n|[ \t]*\n(?P<argindent>[ \t]+)(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\n(?:(?!^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?$)[^\n]*\n){0,20}^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?\n)(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=bodyindent)(?P=req)\.full_url[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n){0,80}?^(?P=bodyindent)(?P<replacement>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=bodyindent)(?P=req)\.full_url[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n){0,40}?^(?P=bodyindent)(?:(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=[ \t]*(?P=replacement)\b|(?P=req)\.(?:add_header|add_unredirected_header)[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*,[ \t]*(?P=replacement)\b[^\n\)]*\))[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=bodyindent)(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27]| (?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27]| del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27]| (?P=req)\.headers\.clear[ \t]*\(| (?P=req)\.headers[ \t]*=[ \t]*| (?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=[ \t]*(?!(?P=replacement)\b)| (?P=req)\.(?:add_header|add_unredirected_header)[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*,[ \t]*(?!(?P=replacement)\b)| (?P=req)\.full_url[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n){0,80}?(?:^(?P=bodyindent)[ \t]*(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?:url[ \t]*=[ \t]*)?(?P=req)\b|^(?P<openerindent>(?P=bodyindent)[ \t]*)(?P<opener>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=bodyindent)(?:elif|else|except|finally|case)\b)(?!^(?P=openerindent)(?:return|raise)\b)(?!^(?P=openerindent)(?P=opener)[ \t]*=)(?!^(?P=openerindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=openerindent)(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27]| (?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27]| del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27]| (?P=req)\.headers\.clear[ \t]*\(| (?P=req)\.headers[ \t]*=[ \t]*| (?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\][ \t]*=[ \t]*(?!(?P=replacement)\b)| (?P=req)\.(?:add_header|add_unredirected_header)[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*,[ \t]*(?!(?P=replacement)\b)| (?P=req)\.full_url[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n){0,40}?^(?P=openerindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?(?P=opener)\.open[ \t]*\([ \t]*(?:\n[ \t]+)?(?:fullurl[ \t]*=[ \t]*)?(?P=req)\b)'
    message: |
      A provably Bearer-valued replacement is applied to an urllib Request after a
      separate URL-safety preflight, and the live request is dispatched through a
      resolver-backed transport. The dispatch can repeat DNS resolution after the
      validation decision. Connect through the already-validated address set.
      [CWE-367 - Time-of-check Time-of-use (TOCTOU) Race Condition]
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]
