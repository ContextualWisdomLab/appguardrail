rules:
  - id: go-sql-injection-sprintf
    patterns:
      - pattern-regex: '\.(?:Query|QueryRow|Exec)(?:Context)?\(\s*(?:\w+\s*,\s*)?fmt\.Sprintf\('
      - pattern-regex: '\.(?:Query|QueryRow|Exec)(?:Context)?\(\s*(?:\w+\s*,\s*)?"(?:[^"\\]|\\.)*"\s*\+\s*[A-Za-z_]'
    message: |
      SQL query is built with fmt.Sprintf or string concatenation before being
      passed to Query/QueryRow/Exec. Interpolated values are injected directly
      into the SQL text, enabling SQL injection. Use parameterized placeholders
      instead: db.QueryContext(ctx, "SELECT ... WHERE id = $1", id).
      [CWE-89] [OWASP A03:2021 - Injection]
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-89]
    owasp: [A03:2021]
    paths:
      include:
        - "**/*.go"

  - id: go-command-injection
    patterns:
      - pattern-regex: 'exec\.Command(?:Context)?\(\s*(?:\w+\s*,\s*)?"(?:/bin/)?(?:sh|bash|zsh|dash)"\s*,\s*"-c"\s*,\s*[A-Za-z_]'
      - pattern-regex: 'exec\.Command(?:Context)?\(\s*(?:\w+\s*,\s*)?"(?:/bin/)?(?:sh|bash|zsh|dash)"\s*,\s*"-c"\s*,\s*"(?:[^"\\]|\\.)*"\s*\+'
    message: |
      exec.Command runs a shell with "-c" and a command string that is not a
      fixed literal. Any attacker-influenced part of that string is interpreted
      by the shell (metacharacters, ;, &&, |), enabling command injection.
      Invoke the target binary directly with separate arguments instead:
      exec.CommandContext(ctx, "ping", "-c", "1", host).
      [CWE-78] [OWASP A03:2021 - Injection]
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-78]
    owasp: [A03:2021]
    paths:
      include:
        - "**/*.go"

  - id: go-tls-insecure-skip-verify
    patterns:
      - pattern-regex: 'InsecureSkipVerify\s*:\s*true'
    message: |
      tls.Config disables certificate verification (InsecureSkipVerify: true).
      Every HTTPS connection made with this config accepts any certificate,
      allowing man-in-the-middle interception of credentials and data.
      Remove the flag, or pin a custom RootCAs pool for private CAs.
      [CWE-295] [OWASP A02:2021 - Cryptographic Failures]
    severity: HIGH
    languages: [generic]
    cwe: [CWE-295]
    owasp: [A02:2021]
    paths:
      include:
        - "**/*.go"

  - id: go-weak-random-token
    patterns:
      - pattern-regex: '(?i)\b(?:token|secret|otp|nonce|session[_-]?id|api[_-]?key|reset[_-]?(?:code|token)|password|passwd)\w*\s*(?::=|=|\+=)\s*[^\n=]{0,80}\brand\.(?:Intn|Int31n?|Int63n?|Uint32|Uint64|Float32|Float64|Perm|NewSource|Seed)\s*\('
    message: |
      A security-sensitive value (token, secret, OTP, session id, ...) is
      generated with math/rand, which is deterministic and predictable —
      attackers can reconstruct the sequence and forge tokens. Use crypto/rand
      instead: crypto/rand.Read for bytes or crypto/rand.Int for numbers.
      [CWE-338] [OWASP A02:2021 - Cryptographic Failures]
    severity: HIGH
    languages: [generic]
    cwe: [CWE-338]
    owasp: [A02:2021]
    paths:
      include:
        - "**/*.go"

  - id: go-hardcoded-jwt-signing-key
    patterns:
      - pattern-regex: '\.SignedString\(\s*\[\]byte\(\s*"(?:[^"\\]|\\.)+"\s*\)\s*\)'
    message: |
      JWT is signed with a hardcoded string literal key. Anyone with repository
      access can mint valid tokens and impersonate any user. Load the signing
      key from an environment variable or secrets manager:
      token.SignedString([]byte(os.Getenv("JWT_SECRET"))).
      [CWE-798] [OWASP A07:2021 - Identification and Authentication Failures]
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-798]
    owasp: [A07:2021]
    paths:
      include:
        - "**/*.go"

  - id: go-pprof-import-exposed
    patterns:
      - pattern-regex: '^\s*_\s+"net/http/pprof"'
    message: |
      Blank import of net/http/pprof registers profiling handlers on the
      default HTTP mux (/debug/pprof/). If the default mux is served publicly,
      this leaks heap contents, goroutine stacks, and command-line arguments,
      and enables CPU-profiling denial of service. Serve pprof only on a
      separate localhost-bound listener, or gate it behind authentication.
      [CWE-489] [OWASP A05:2021 - Security Misconfiguration]
    severity: WARNING
    languages: [generic]
    cwe: [CWE-489]
    owasp: [A05:2021]
    paths:
      include:
        - "**/*.go"
