rules:
  - id: firebase-public-read-write
    pattern: "allow read, write: if true"
    message: "Public Firebase rules found. Anyone can read and write to your database."
    severity: "CRITICAL"
  - id: firebase-public-read
    pattern: "allow read: if true"
    message: "Public Firebase read rules found. Anyone can read your database."
    severity: "HIGH"
