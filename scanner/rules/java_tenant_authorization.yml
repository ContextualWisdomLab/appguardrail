rules:
  - id: java-spring-admin-discarded-tenant-context
    patterns:
      - pattern-regex: '(?ms)@(?:Get|Post|Put|Patch|Delete|Request)Mapping\s*\(\s*"[^"\n]*/admin/[^"\n]*"[^)]*\)\n(?:(?![ \t]*@(?:Get|Post|Put|Patch|Delete|Request)Mapping\b)(?![ \t]*tenantAccessService\.require(?:Signed)?\s*\()[^\n]*\n)*+^[ \t]*tenantAccessService\.require(?:Signed)?\s*\((?:[^\n]*\n){0,8}?[^\n]*TenantPermissions\.ADMIN_(?:READ|WRITE)[^\n]*\n?[ \t]*\);\n(?:(?![ \t]*@(?:Get|Post|Put|Patch|Delete|Request)Mapping\b)(?![^\n]*\bconversionService\.(?:getAllJobs|deleteJob|retryDeadLettered)\s*\()[^\n]*\n)*+[^\n]*\bconversionService\.(?:getAllJobs|deleteJob|retryDeadLettered)\s*\('
    message: |
      A Spring admin endpoint checks a tenant permission but discards the
      returned tenant authorization context before a tenant-sensitive service
      read or mutation. Capture the returned TenantContext and enforce its
      tenant identity at the trusted service/data boundary, or prove complete
      tenant filtering before returning data. [CWE-863 - Incorrect Authorization]
      [OWASP ASVS v5.0.0-8.4.1]
    severity: HIGH
    languages: [java]
    prefilter: ["/admin/", "tenantAccessService", "TenantPermissions.ADMIN_"]
    cwe: [CWE-863]
