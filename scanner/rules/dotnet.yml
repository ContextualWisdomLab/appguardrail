rules:
  # C# / ASP.NET security rules. The engine has no csharp language mapping,
  # so every rule here uses languages: [generic] and scopes itself with
  # paths.include globs (*.cs, *.cshtml, appsettings*.json, web.config).
  - id: dotnet-sql-injection-concat
    patterns:
      - pattern-regex: '(?:new\s+Sql(?:Command|DataAdapter)|ExecuteSqlRaw(?:Async)?|FromSqlRaw)\s*\(\s*(?:(?:\$@?|@\$)"[^"]*\{|@?"[^"\n]*"\s*\+\s*\w)'
    message: |
      SQL command is built from string concatenation or interpolation. This is
      SQL-injectable if any part is user-controlled. Use parameterized queries
      (SqlParameter) or the interpolated EF Core APIs (ExecuteSqlInterpolated /
      FromSqlInterpolated), which parameterize interpolated values.
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-89]
    owasp: [A03:2021]
    paths:
      include:
        - "**/*.cs"

  - id: dotnet-binaryformatter-deserialize
    patterns:
      - pattern-regex: '\bnew\s+(?:BinaryFormatter|SoapFormatter|NetDataContractSerializer|LosFormatter|ObjectStateFormatter)\s*\('
    message: |
      BinaryFormatter-family serializers are inherently unsafe: deserializing
      attacker-controlled data leads to remote code execution, and Microsoft
      has deprecated them (removed in .NET 9). Use System.Text.Json,
      DataContractSerializer with a bounded known-type set, or protobuf.
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-502]
    owasp: [A08:2021]
    paths:
      include:
        - "**/*.cs"

  - id: dotnet-process-start-user-input
    patterns:
      - pattern-regex: '(?:Process\.Start|new\s+ProcessStartInfo)\s*\((?:[^)\n]*(?:\$@?|@\$)"[^"]*\{|[^)\n]*"\s*\+\s*\w)'
      - pattern-regex: 'Arguments\s*=\s*(?:(?:\$@?|@\$)"[^"]*\{|@?"[^"\n]*"\s*\+\s*\w)'
    message: |
      Process command line is built from string concatenation or interpolation.
      If any part is user-controlled this allows OS command / argument
      injection. Pass a fixed FileName plus ArgumentList entries (which are
      escaped per-argument) and validate input against a strict allowlist.
    severity: CRITICAL
    languages: [generic]
    cwe: [CWE-78]
    owasp: [A03:2021]
    paths:
      include:
        - "**/*.cs"

  - id: aspnet-request-validation-disabled
    patterns:
      - pattern-regex: '(?i)validateRequest\s*=\s*"false"'
      - pattern-regex: '\[ValidateInput\s*\(\s*false\s*\)\]'
    message: |
      ASP.NET request validation is disabled (ValidateRequest="false" or
      [ValidateInput(false)]), removing the built-in guard against markup in
      request input and making reflected XSS much easier. Keep validation on,
      and where raw HTML input is genuinely required, encode on output and
      sanitize with a vetted HTML sanitizer.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-79]
    owasp: [A03:2021]
    paths:
      include:
        - "**/*.cs"
        - "**/*.cshtml"
        - "**/*.aspx"
        - "**/*.ascx"
        - "**/web.config"
        - "**/Web.config"

  - id: dotnet-cookie-secure-false
    patterns:
      - pattern-regex: 'CookieSecurePolicy\s*\.\s*None'
      - pattern-regex: '(?i)\bSecure\s*=\s*false\b'
      - pattern-regex: '(?i)requireSSL\s*=\s*"false"'
    message: |
      Cookie is configured without the Secure flag (CookieSecurePolicy.None,
      Secure = false, or requireSSL="false"), so it can be sent over plaintext
      HTTP and intercepted. Use CookieSecurePolicy.Always (or Secure = true /
      requireSSL="true") for session and auth cookies.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-614]
    owasp: [A05:2021]
    paths:
      include:
        - "**/*.cs"
        - "**/web.config"
        - "**/Web.config"

  - id: appsettings-connectionstring-password
    patterns:
      - pattern-regex: '(?i)"[^"\n]*;\s*(?:password|pwd)\s*=\s*[^;"{$%#\s][^;"\n]*'
    message: |
      Connection string in configuration contains a literal password. Anyone
      with repo access gets database credentials, and the value is easy to
      leak via source control. Load secrets from environment variables, user
      secrets, or a managed secret store (Azure Key Vault, AWS Secrets
      Manager), or use passwordless auth (managed identity).
    severity: HIGH
    languages: [generic]
    cwe: [CWE-798]
    owasp: [A05:2021]
    paths:
      include:
        - "**/appsettings*.json"
        - "**/web.config"
        - "**/Web.config"
        - "**/App.config"
        - "**/app.config"
