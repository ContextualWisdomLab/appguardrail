rules:
  - id: javascript-jwt-hardcoded-secret-fallback
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:const|let|var)\s+(?P<secret>[A-Za-z_$][A-Za-z0-9_$]*)\s*=\s*process\.env(?:\.[A-Za-z_$][A-Za-z0-9_$]*|\[\s*["''][^"''\n]+["'']\s*\])\s*(?:\|\||\?\?)\s*(?P<quote>["''`])(?P<fallback>[^"''`\n]{8,})(?P=quote)\s*;?(?=(?:(?!^[ \t]*(?:const|let|var)\s+(?P=secret)\b).){0,12000}?createHmac\s*\(\s*["''`]sha256["''`]\s*,\s*(?P=secret)\b)'
    message: |
      An HS256 signing key falls back to a hardcoded string when its environment
      variable is absent. Every deployment can then share a discoverable token
      signing key, allowing forged authentication tokens. Remove the literal
      fallback, fail closed when the secret is absent or weak, and load a
      high-entropy key from managed secret storage.
      [CWE-321 - Use of Hard-coded Cryptographic Key]
      [CWE-798 - Use of Hard-coded Credentials]
      [OWASP A07:2021 - Identification and Authentication Failures]
    severity: CRITICAL
    languages: [javascript, typescript]
    prefilter: ["process.env", "createHmac", "HS256"]
    cwe: [CWE-321, CWE-798]
    owasp: [A07:2021]
