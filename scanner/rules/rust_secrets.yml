rules:
  - id: rust-auth-secret-raw-env-runtime-source
    patterns:
      - pattern-regex: '(?msx)(?:\badmin_token\s*:\s*std::env::var\s*\(\s*["\x27]ADMIN_TOKEN["\x27]\s*\)\s*\.ok\s*\(\s*\)|\bparse_admin_tokens\s*\(\s*&?\s*std::env::var\s*\(\s*["\x27]ADMIN_TOKENS["\x27]\s*\)\s*\.unwrap_or_default\s*\(\s*\)\s*,?\s*\))'
    message: |
      A Rust authentication token is sourced directly from a cleartext process
      environment variable at the runtime authentication boundary. Environment
      variables can be visible to sibling/child processes, diagnostics, dumps,
      and logs. Use a dedicated credential or secret-management abstraction for
      runtime authentication; if environment variables are required as bootstrap
      transport, ingest them once into that boundary and make request-time auth
      consume the protected registry instead.
      [CWE-526 - Cleartext Storage of Sensitive Information in an Environment Variable]
      [OWASP A07:2021 - Identification and Authentication Failures]
    severity: HIGH
    languages: [generic]
    prefilter: [std::env::var, ADMIN_TOKEN, admin_token]
    cwe: [CWE-526]
    owasp: [A07:2021]
