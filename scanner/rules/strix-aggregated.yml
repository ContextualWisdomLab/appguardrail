rules:
  # Detection rules aggregated from the organization Strix Security Scan corpus
  # (and the per-repo `.jules/sentinel.md` learning logs) across the
  # ContextualWisdomLab ecosystem. Each rule encodes a concrete, code-level
  # vulnerability class that Strix flagged in one or more member repositories
  # (codec-carver, naruon, newsdom-api, fast-mlsirm, and others) but that the
  # existing AppGuardrail rule set did not yet detect. Patterns are anchored on
  # unambiguous API idioms so they do not overlap with the built-in
  # command-injection / deserialization / crypto rules.
  #
  # Provenance and rationale are recorded in CHANGELOG.md. Where a finding is a
  # hardening recommendation rather than an always-exploitable bug (weak hash,
  # host-resolution helper, permission copy), severity is MEDIUM so it surfaces
  # as a non-blocking warning instead of a deploy blocker.

  - id: python-numpy-load-allow-pickle
    patterns:
      - pattern-regex: '(?i)\ballow_pickle\s*=\s*True\b'
    message: |
      numpy.load(..., allow_pickle=True) deserializes arbitrary Python objects
      through pickle and executes attacker-controlled code if the .npy/.npz file
      is untrusted. Load numeric arrays with allow_pickle=False (the safe
      default) and use a non-pickle format for anything that must round-trip
      Python objects. [CWE-502 - Deserialization of Untrusted Data]
      [OWASP A08:2021 - Software and Data Integrity Failures]
    severity: CRITICAL
    languages: [python]
    cwe: [CWE-502]
    owasp: [A08:2021]

  - id: python-xml-insecure-parser
    patterns:
      - pattern-regex: '(?i)\b(?:ElementTree|etree|minidom|pulldom)\.(?:parse|fromstring|iterparse|parseString)\s*\(|\bxml\.sax\.(?:parse|parseString|make_parser)\s*\(|\bexpat\.ParserCreate\s*\('
    message: |
      A standard-library XML parser (xml.etree / minidom / pulldom / sax / expat)
      or lxml.etree is used on potentially untrusted input. These parsers resolve
      external entities and expand nested entities, exposing XXE (local file read,
      SSRF) and billion-laughs denial of service. Parse untrusted XML with
      defusedxml (e.g. `import defusedxml.ElementTree as ET`). [CWE-611 -
      Improper Restriction of XML External Entity Reference]
      [OWASP A05:2021 - Security Misconfiguration]
    severity: HIGH
    languages: [python]
    cwe: [CWE-611]
    owasp: [A05:2021]

  - id: python-gethostbyname-ssrf-bypass
    patterns:
      - pattern-regex: '(?i)\bsocket\.gethostbyname(?:_ex)?\s*\('
    message: |
      socket.gethostbyname resolves only the first IPv4 address and raises on
      IPv6 literals, so SSRF allow/deny host validation built on it is bypassable
      via IPv6, dotless-decimal, or DNS-rebinding payloads. Enumerate every
      resolved address with socket.getaddrinfo(host, None) (IPv4 and IPv6) and
      reject any ipaddress that is private, loopback, link-local, or reserved
      before connecting. [CWE-918 - Server-Side Request Forgery]
      [OWASP A10:2021 - Server-Side Request Forgery]
    severity: MEDIUM
    languages: [python]
    cwe: [CWE-918]
    owasp: [A10:2021]

  - id: python-ffmpeg-missing-protocol-whitelist
    patterns:
      - pattern-regex: '(?is)(?:subprocess\.(?:run|Popen|call|check_call|check_output)|os\.system|os\.popen)\s*\((?:(?!protocol_whitelist).){0,300}?\b(?:ffmpeg|ffprobe)\b(?:(?!protocol_whitelist)[^)]){0,300}?\)'
    message: |
      ffmpeg/ffprobe is invoked without -protocol_whitelist. On user-supplied
      media (or HLS/playlist inputs), ffmpeg will follow http/https/file/concat
      protocols, enabling SSRF to internal services and local file disclosure.
      Pass `-protocol_whitelist file,crypto,data` (plus `-nostdin`) before `-i`,
      and resolve input paths to an allowed directory. [CWE-918 - Server-Side
      Request Forgery] [OWASP A10:2021 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    cwe: [CWE-918]
    owasp: [A10:2021]

  - id: python-copymode-preserves-setuid
    patterns:
      - pattern-regex: '(?i)\bshutil\.(?:copymode|copystat)\s*\('
    message: |
      shutil.copymode / shutil.copystat copies the source permission bits
      verbatim, including setuid, setgid, and the sticky bit. Propagating those
      bits onto a generated output file can create a privilege-escalation vector.
      Set the destination mode explicitly and mask special bits, e.g.
      os.chmod(dest, stat.S_IMODE(os.stat(src).st_mode) & 0o777). [CWE-732 -
      Incorrect Permission Assignment for Critical Resource]
      [OWASP A05:2021 - Security Misconfiguration]
    severity: MEDIUM
    languages: [python]
    cwe: [CWE-732]
    owasp: [A05:2021]

  - id: weak-hash-md5-sha1
    patterns:
      - pattern-regex: '(?i)\b(?:hashlib\.(?:md5|sha1)|md5\.new|sha\.new)\s*\(|createHash\s*\(\s*[\x22\x27](?:md5|sha1)[\x22\x27]'
    message: |
      MD5 or SHA-1 is used. Both are cryptographically broken (collisions), so
      they must not back signatures, integrity checks, token/ID derivation, or
      deduplication where a collision has security impact. Use SHA-256 or
      stronger. If the digest is a non-security checksum, this warning can be
      accepted. [CWE-328 - Use of Weak Hash]
      [OWASP A02:2021 - Cryptographic Failures]
    severity: MEDIUM
    languages: [python, javascript, typescript]
    cwe: [CWE-328]
    owasp: [A02:2021]
