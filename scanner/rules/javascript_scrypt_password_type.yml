# AppGuardrail detector artifact: non-executable SAST signature data.
# Vulnerable source shapes below describe detection targets, not AppGuardrail runtime code.
rules:
  - id: javascript-auth-scrypt-unvalidated-password-type
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:export\s+)?(?:async\s+)?function\s+hashPassword\s*\(\s*(?P<pw>[A-Za-z_$][A-Za-z0-9_$]*)(?:\s*:\s*[^,)]+)?\s*\)\s*(?:\:\s*[^{]+)?\s*\{(?:(?!^[ \t]*(?:export\s+)?(?:async\s+)?function\s+|if\s*\(\s*typeof\s+(?P=pw)\s*!={1,2}\s*["'']string["'']\s*\)\s*(?:\{\s*)?(?:return\b|throw\b)).){0,3000}?scryptSync\s*\(\s*(?P=pw)\s*,'
    message: |
      A password hashing function passes its parameter directly to Node.js
      scryptSync without a supported fail-closed string-type rejection before
      the sink. Validate or normalize the password to a supported type before
      the cryptographic call.
      [CWE-1287 - Improper Validation of Specified Type of Input]
    severity: HIGH
    languages: [javascript, typescript]
    prefilter: ["scryptSync(", "function hashPassword"]
    cwe: [CWE-1287]

  - id: javascript-auth-scrypt-unvalidated-password-type
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:export\s+)?(?:async\s+)?function\s+verifyPassword\s*\(\s*(?P<pw>[A-Za-z_$][A-Za-z0-9_$]*)(?:\s*:\s*[^,)]+)?\s*,[^)]*\)\s*(?:\:\s*[^{]+)?\s*\{(?:(?!^[ \t]*(?:export\s+)?(?:async\s+)?function\s+|if\s*\(\s*typeof\s+(?P=pw)\s*!={1,2}\s*["'']string["'']\s*\)\s*(?:\{\s*)?(?:return\b|throw\b)).){0,3000}?scryptSync\s*\(\s*(?P=pw)\s*,'
    message: |
      A password verification function passes its parameter directly to Node.js
      scryptSync without a supported fail-closed string-type rejection before
      the sink. Reject unsupported authentication inputs before the cryptographic
      call.
      [CWE-1287 - Improper Validation of Specified Type of Input]
    severity: HIGH
    languages: [javascript, typescript]
    prefilter: ["scryptSync(", "function verifyPassword"]
    cwe: [CWE-1287]
