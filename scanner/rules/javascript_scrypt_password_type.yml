rules:
  - id: javascript-auth-scrypt-unvalidated-password-type
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:export\s+)?function\s+hashPassword\s*\(\s*(?P<pw>[A-Za-z_$][A-Za-z0-9_$]*)\s*\)\s*\{(?:(?!^[ \t]*\}|typeof\s+(?P=pw)\s*(?:===|!==|==|!=)\s*["'']string["'']).){0,3000}?scryptSync\s*\(\s*(?P=pw)\s*,'
    message: |
      A password hashing function passes its unvalidated parameter directly to
      Node.js scryptSync before establishing a supported input type. Untyped
      JSON values can therefore reach a cryptographic API that does not accept
      arbitrary objects. Validate or normalize the password to a supported type
      before the scrypt call.
      [CWE-1287 - Improper Validation of Specified Type of Input]
      [CWE-248 - Uncaught Exception]
    severity: HIGH
    languages: [javascript, typescript]
    prefilter: ["scryptSync(", "function hashPassword"]
    cwe: [CWE-1287, CWE-248]

  - id: javascript-auth-scrypt-unvalidated-password-type
    patterns:
      - pattern-regex: '(?msx)^[ \t]*(?:export\s+)?function\s+verifyPassword\s*\(\s*(?P<pw>[A-Za-z_$][A-Za-z0-9_$]*)\s*,[^)]*\)\s*\{(?:(?!^[ \t]*\}|typeof\s+(?P=pw)\s*(?:===|!==|==|!=)\s*["'']string["'']).){0,3000}?scryptSync\s*\(\s*(?P=pw)\s*,'
    message: |
      A password verification function passes its unvalidated parameter directly
      to Node.js scryptSync before a supported input-type check. Reject non-string
      authentication inputs before the cryptographic sink so malformed JSON cannot
      trigger an unsupported-input exception path.
      [CWE-1287 - Improper Validation of Specified Type of Input]
      [CWE-248 - Uncaught Exception]
    severity: HIGH
    languages: [javascript, typescript]
    prefilter: ["scryptSync(", "function verifyPassword"]
    cwe: [CWE-1287, CWE-248]
