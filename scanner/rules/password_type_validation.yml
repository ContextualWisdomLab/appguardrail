rules:
  - id: javascript-json-password-string-coercion-before-hash
    patterns:
      - pattern-regex: '(?msx)c\.req\.json\s*\(\s*\)(?=(?:(?!typeof\s+password\s*(?:===|!==|==|!=)\s*["'']string["'']).){0,4000}?String\s*\(\s*password\s*\)\.length)(?=(?:(?!typeof\s+password\s*(?:===|!==|==|!=)\s*["'']string["'']).){0,8000}?hashPassword\s*\(\s*password\s*\))'
    message: |
      A password read from an untyped JSON body is converted with String(...)
      for validation and later forwarded in its original type to a password
      hashing helper. Non-string JSON values can pass the coercive length check
      but violate downstream cryptographic type contracts. Reject non-string
      passwords before length checks and before password hashing.
      [CWE-1287 - Improper Validation of Specified Type of Input]
    severity: MEDIUM
    languages: [javascript, typescript]
    prefilter: ["c.req.json", "String(password)", "hashPassword"]
    cwe: [CWE-1287]

  - id: javascript-json-password-untyped-verify-fallback
    patterns:
      - pattern-regex: '(?msx)c\.req\.json\s*\(\s*\)(?=(?:(?!typeof\s+password\s*(?:===|!==|==|!=)\s*["'']string["'']).){0,5000}?verifyPassword\s*\(\s*password\s*\|\|\s*["'']["'']\s*,)'
    message: |
      A password read from an untyped JSON body is passed through a truthy
      fallback directly into a password-verification helper. Objects or arrays
      remain truthy and can reach downstream cryptographic operations with an
      unsupported type, producing request failures instead of a controlled
      authentication rejection. Require a string type check before verification.
      [CWE-1287 - Improper Validation of Specified Type of Input]
    severity: MEDIUM
    languages: [javascript, typescript]
    prefilter: ["c.req.json", "verifyPassword", "password ||"]
    cwe: [CWE-1287]
