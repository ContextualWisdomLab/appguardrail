rules:
  - id: python-stored-ssrf-webhook-url
    patterns:
      - pattern-regex: '(?is)(?:\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*)\.get\s*\(\s*["\x27]url["\x27]\s*\)|\b(?P<webhook_url_var>[A-Za-z_][A-Za-z0-9_]*url[A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*)\.get\s*\(\s*["\x27]url["\x27]\s*\)(?:(?!_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)).){0,800}?\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\))'
    message: |
      A webhook URL is persisted directly from request data without an explicit
      validation boundary. Validate the URL with a fail-closed SSRF policy before
      storing it, and revalidate or pin the destination before outbound delivery.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    cwe: [CWE-918]
    owasp: [A10:2021]
