rules:
  - id: python-stored-ssrf-webhook-url
    patterns:
      - pattern-regex: '(?is)(?:\b(?P<unguarded_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P<unguarded_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=unguarded_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=unguarded_indent)[ \t]+[^\n]*\n){0,20}?(?P=unguarded_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P=unguarded_indent)\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))|\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])|\b(?P<webhook_url_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<reject_indent>[ \t]*)if\s+(?:(?P=webhook_url_var)\s+is\s+not\s+None\s+and\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?:(?P=webhook_url_var)\s+and\s+)?not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?P=webhook_url_var)\s+not\s+in\s*\(\s*None\s*,\s*["\x27]["\x27]\s*\)\s+and\s*\(\s*not\s+isinstance\s*\(\s*(?P=webhook_url_var)\s*,\s*str\s*\)\s+or\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)\s*\))(?:(?!:).){0,100}:\s*(?:#[^\n]*)?\n(?:(?P=reject_indent)[ \t]+[^\n]*\n){0,20}?(?P=reject_indent)[ \t]+\b(?:return|raise)\b))(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<guard_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=guard_indent)[ \t]+[^\n]*\n){0,20}?(?P=guard_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\)))(?:(?!\bset_webhook\b).){0,800}?\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\))'
    message: |
      A webhook URL is persisted directly from request data without an explicit
      validation boundary. Validate the URL with a fail-closed SSRF policy before
      storing it, and revalidate or pin the destination before outbound delivery.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [set_webhook]
    cwe: [CWE-918]
    owasp: [A10:2021]
  - id: python-bearer-preflight-dns-toctou
    patterns:
      - pattern-regex: '(?imsx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).)*?^(?P<bodyindent>(?P=defindent)[ \t]+)if[ \t]+not[ \t]+_is_safe_url[ \t]*\([ \t]*(?P<url>[A-Za-z_][A-Za-z0-9_]*)[ \t]*\)[ \t]*:[^\n]*\n(?:(?:^(?P=bodyindent)[ \t]+\#[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=bodyindent)[ \t]+(?:return|raise)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=url)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=url)\b))[^\n]*\n)*?^(?P=bodyindent)(?P<endpoint>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=url)\.rstrip[ \t]*\([^\n]*\)[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=endpoint)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?:(?P=endpoint)|(?P=url))\b))[^\n]*\n)*?^(?P=bodyindent)(?P<req>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\([ \t]*(?:(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b(?=[ \t]*,[ \t]*headers[ \t]*=[ \t]*\{[^\n\#}]*["\x27]Authorization["\x27][ \t]*:[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*))[^\n]*\)[ \t]*(?:\#[^\n]*)?$|\n(?P<requestargindent>[ \t]+)(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b[^\n]*\n(?:(?:^(?P=requestargindent)(?!headers\b)(?![^\n]*["\x27]Authorization["\x27])[^\n]*\n)|(?:^[ \t]*\n)){0,8}^(?P=requestargindent)headers[ \t]*=[ \t]*\{(?:(?!\}).){0,1000}?["\x27]Authorization["\x27][ \t]*:[ \t]*(?:f?["\x27]Bearer[ \t]+\{?[A-Za-z_][A-Za-z0-9_]*\}?[^"\x27\n]*["\x27]|["\x27]Bearer[ \t]+["\x27][ \t]*\+[ \t]*[A-Za-z_][A-Za-z0-9_]*)(?:(?!^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?$)(?!^[ \t]*\#)[^\n]*\n){0,30}?^(?P=bodyindent)\)[ \t]*(?:\#[^\n]*)?$)\n(?!(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,3000}?^(?P<authremoveindent>(?P=bodyindent)[ \t]+)(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*\)|(?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27][^\n]*\)|del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\])[^\n]*\n(?:(?!^(?P=bodyindent)\S).){0,1500}?^(?P=authremoveindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b)(?!(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b).){0,3000}?^(?P<reqreplaceindent>(?P=bodyindent)[ \t]+)(?P=req)[ \t]*=[ \t]*urllib\.request\.Request[ \t]*\((?:(?!(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b)[^\n]*|(?:url[ \t]*=[ \t]*)?(?P=endpoint)\b(?![^\n\#]*["\x27]Authorization["\x27][^\n\#]*Bearer)[^\n]*)\)[ \t]*(?:\#[^\n]*)?\n(?:(?!^(?P=bodyindent)\S).){0,1500}?(?:^(?P=reqreplaceindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=reqreplaceindent)(?P<nestedopener>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[^\n]*\n(?:(?!^(?P=bodyindent)\S).){0,800}?^(?P=reqreplaceindent)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?(?P=nestedopener)\.open[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b))(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=bodyindent)(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*\)|(?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27][^\n]*\)|del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\])).){0,3000}?(?:^(?P=bodyindent)(?P<opener1>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[ \t]*[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?P=req)[ \t]*=[ \t]*(?![^"\x27\n#]*\b(?P=req)\b))(?!^(?P=bodyindent)(?:(?P=req)\.remove_header[ \t]*\([ \t]*["\x27]Authorization["\x27][ \t]*\)|(?P=req)\.headers\.pop[ \t]*\([ \t]*["\x27]Authorization["\x27][^\n]*\)|del[ \t]+(?P=req)\.headers[ \t]*\[[ \t]*["\x27]Authorization["\x27][ \t]*\])).){0,1000}?^(?P=bodyindent)[ \t]*(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?(?P=opener1)\.open[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=bodyindent)try[ \t]*:[^\n]*\n^(?P<tryindent3>(?P=bodyindent)[ \t]+)(?P<opener2>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*urllib\.request\.build_opener[ \t]*\([ \t]*SafeRedirectHandler[ \t]*\([ \t]*\)[ \t]*\)[ \t]*[^\n]*\n(?:(?!^(?P=bodyindent)(?:except|finally)\b).){0,1200}?^[ \t]+(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?(?P=opener2)\.open[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=bodyindent)[ \t]*(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=bodyindent)[ \t]*with[ \t]+urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=bodyindent)try[ \t]*:[^\n]*\n^(?P<urltryindent3>(?P=bodyindent)[ \t]+)(?:return[ \t]+|[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b|^(?P=bodyindent)try[ \t]*:[^\n]*\n^(?P<withtryindent3>(?P=bodyindent)[ \t]+)with[ \t]+urllib\.request\.urlopen[ \t]*\([ \t]*(?:\n[ \t]+)?(?P=req)\b)'
    message: |
      A bearer-authenticated urllib request is sent after a separate URL-safety
      preflight. The network client can resolve the hostname again after validation,
      creating a DNS-rebinding TOCTOU path for credential-bearing traffic. Connect
      through the already-validated address set, or enforce an equivalent egress
      boundary while preserving TLS hostname verification.
      [CWE-367 - Time-of-check Time-of-use (TOCTOU) Race Condition]
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url, urllib.request.Request, Authorization, Bearer]
    cwe: [CWE-367, CWE-918]
    owasp: [A10:2021]