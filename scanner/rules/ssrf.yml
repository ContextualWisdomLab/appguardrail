rules:
  - id: python-stored-ssrf-webhook-url
    patterns:
      - pattern-regex: '(?is)(?:\b(?P<unguarded_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P<unguarded_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=unguarded_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=unguarded_indent)[ \t]+[^\n]*\n){0,20}?(?P=unguarded_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P=unguarded_indent)\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))|\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])|\b(?P<webhook_url_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<try_indent>[ \t]*)try:\s*(?:#[^\n]*)?\n(?:(?:(?P=try_indent)[ \t]+[^\n]*\n){0,20}?(?P=try_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\)[^\n]*\n)+(?:(?P=try_indent)[ \t]+[^\n]*\n){0,20}?(?P=try_indent)except\s+ValueError\b))(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<reject_indent>[ \t]*)if\s+(?:(?P=webhook_url_var)\s+is\s+not\s+None\s+and\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?:(?P=webhook_url_var)\s+and\s+)?not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?P=webhook_url_var)\s+not\s+in\s*\(\s*None\s*,\s*["\x27]["\x27]\s*\)\s+and\s*\(\s*not\s+isinstance\s*\(\s*(?P=webhook_url_var)\s*,\s*str\s*\)\s+or\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)\s*\))(?:(?!:).){0,100}:\s*(?:#[^\n]*)?\n(?:(?P=reject_indent)[ \t]+[^\n]*\n){0,20}?(?P=reject_indent)[ \t]+\b(?:return|raise)\b))(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<guard_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=guard_indent)[ \t]+[^\n]*\n){0,20}?(?P=guard_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\))).{0,800}?\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\))'
    message: |
      A webhook URL is persisted directly from request data without an explicit
      validation boundary. Validate the URL with a fail-closed SSRF policy before
      storing it, and revalidate or pin the destination before outbound delivery.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [set_webhook]
    cwe: [CWE-918]
    owasp: [A10:2021]
  - id: python-unauthenticated-urllib-dns-validation-to-connect
    patterns:
      - pattern-regex: '(?ms)^[ \t]*(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*\s*\((?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,600}?\)\s*(?:->[^\n:]+)?\s*:\s*(?:#[^\n]*)?\n(?!(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).)*?\b(?i:Authorization|Bearer)\b)(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,1800}?\bif\s+not\s+_is_safe_url\s*\(\s*(?P<validated_url>[A-Za-z_][A-Za-z0-9_]*)\s*\)\s*:[^\n]{0,400}\n(?:[ \t]+[^\n]{0,400}\n){0,4}?[ \t]+(?:return\b|raise\b)(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+)(?!\b(?P=validated_url)\s*=).){0,1200}?(?:\b(?P<request_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:urllib\.request\.)?Request\s*\(\s*(?:#[^\n]*\n\s*)?(?P=validated_url)(?=\s*(?:,|\)))(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+)(?!\b(?P=request_var)\s*=).){0,800}?\b(?P<opener_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:urllib\.request\.)?build_opener\s*\([^\n]*\)(?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+)(?!\b(?P=request_var)\s*=).){0,400}?\b(?P=opener_var)\.open\s*\(\s*(?:#[^\n]*\n\s*)?(?P=request_var)(?=\s*(?:,|\)))|\b(?:urllib\.request\.)?urlopen\s*\(\s*(?P=validated_url)(?=\s*(?:,|\)))|\bsuper\s*\(\s*\)\.redirect_request\s*\([^\n]*\b(?P=validated_url)\s*\))'
    message: |
      An unauthenticated URL is validated before an ordinary urllib request or
      redirect hands the hostname back to the resolver, leaving a DNS
      validation-to-connect race.
      Resolve once per hop, reject mixed or non-global answers, pin the TCP peer,
      and preserve the original hostname for TLS verification.
      [CWE-918 - Server-Side Request Forgery]
      [CWE-367 - Time-of-check Time-of-use (TOCTOU) Race Condition]
    severity: HIGH
    languages: [python]
    prefilter: [_is_safe_url]
    cwe: [CWE-918, CWE-367]
    owasp: [A10:2021]
  - id: python-ssrf-dns-resolution-fail-open
    patterns:
      - pattern-regex: '(?ms)^(?P<dns_function_indent>[ \t]*)(?:async[ \t]+)?def[ \t]+(?i:[A-Za-z_][A-Za-z0-9_]*(?:safe|valid|allow|permit|destination|url)[A-Za-z0-9_]*)\s*\((?:(?!^[ \t]*(?:(?:async[ \t]+)?def|class)[ \t]+).){0,600}?\)\s*(?:->[^\n:]+)?\s*:\s*(?:#[^\n]*)?\n(?:(?!^(?P=dns_function_indent)(?:(?:async[ \t]+)?def|class)[ \t]+).){0,2400}?^(?P<dns_try_indent>[ \t]+)try\s*:\s*(?:#[^\n]*)?\n(?:(?!^[ \t]+(?:(?:async[ \t]+)?def|class|try)\b)(?!^(?P=dns_try_indent)(?:except|else|finally)\b).){0,1800}?\b(?:socket\.)?(?:gethostbyname|getaddrinfo)\s*\((?:(?!^[ \t]+(?:(?:async[ \t]+)?def|class|try)\b)(?!^(?P=dns_try_indent)(?:except|else|finally)\b).){0,1800}?^(?P=dns_try_indent)except[ \t]+(?:socket\.)?gaierror(?:[ \t]+as[ \t]+[A-Za-z_][A-Za-z0-9_]*)?\s*:\s*(?:#[^\n]*)?\n(?:(?P=dns_try_indent)[ \t]+return[ \t]+True(?=[ \t]*(?:#[^\n]*)?$)|(?:(?P=dns_try_indent)[ \t]+(?:#[^\n]*\n|pass[ \t]*(?:#[^\n]*)?\n)){1,8}(?:(?P=dns_try_indent)except[^\n:]*:\s*(?:#[^\n]*)?\n(?:(?P=dns_try_indent)[ \t]+(?:#[^\n]*\n|return[ \t]+False\b[^\n]*\n|raise\b[^\n]*\n)){1,8}){0,3}(?:[ \t]*\n){0,3}(?P=dns_try_indent)return[ \t]+True(?=[ \t]*(?:#[^\n]*)?$))'
    message: |
      DNS resolution failure is swallowed and the destination is still admitted,
      so missing security evidence becomes permission for an SSRF-capable request.
      Fail closed on resolver errors and empty answers before any network use.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [gaierror]
    cwe: [CWE-918]
    owasp: [A10:2021]
  - id: python-ssrf-hostname-unbound-local-address-exception
    patterns:
      - pattern-regex: '(?ms)^(?P<function_indent>[ \t]*)(?:async[ \t]+)?def[ \t]+(?i:[A-Za-z_][A-Za-z0-9_]*(?:valid|allow|permit|egress|address)[A-Za-z0-9_]*)\s*\((?>(?:(?!^(?P=function_indent)(?:(?:async[ \t]+)?def|class)[ \t]+).){0,600}?\)\s*(?:->[^\n:]+)?\s*:\s*(?:#[^\n]*)?\n)(?!(?:(?!^(?P=function_indent)(?:(?:async[ \t]+)?def|class)[ \t]+)(?!^(?P<prior_allow_indent>[ \t]+)if[ \t]+[A-Za-z_][A-Za-z0-9_]*\.allow_local[ \t]*:\s*(?:#[^\n]*)?\n(?P=prior_allow_indent)[ \t]+if[ \t]+[A-Za-z_][A-Za-z0-9_]*\.is_loopback[ \t]*:\s*(?:#[^\n]*)?\n(?P=prior_allow_indent)[ \t]+[A-Za-z_][A-Za-z0-9_]*\s*=\s*True(?=[ \t]*(?:#[^\n]*)?$)).){0,3000}?^(?P<guard_indent>[ \t]+)if[ \t]+(?:not[ \t]+_is_local_dev_host\([ \t]*hostname[ \t]*\)|hostname[ \t]+not[ \t]+in[ \t]+[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*\.(?i:local[A-Za-z0-9_]*))[ \t]*:[ \t]*(?:#[^\n]*)?\n(?P=guard_indent)[ \t]+return[ \t]+False\b(?:(?!^(?P=function_indent)(?:(?:async[ \t]+)?def|class)[ \t]+).){0,3000}?^(?P=guard_indent)if[ \t]+[A-Za-z_][A-Za-z0-9_]*\.allow_local[ \t]*:)(?:(?!^(?P=function_indent)(?:(?:async[ \t]+)?def|class)[ \t]+).){0,4000}?^(?P<allow_indent>[ \t]+)if[ \t]+[A-Za-z_][A-Za-z0-9_]*\.allow_local[ \t]*:\s*(?:#[^\n]*)?\n(?P=allow_indent)[ \t]+if[ \t]+[A-Za-z_][A-Za-z0-9_]*\.is_loopback[ \t]*:\s*(?:#[^\n]*)?\n(?P=allow_indent)[ \t]+[A-Za-z_][A-Za-z0-9_]*\s*=\s*True(?=[ \t]*(?:#[^\n]*)?$)'
    message: |
      A local-address exception admits loopback under a global allow_local switch
      without binding the exception to the original hostname. A remote hostname
      can therefore rebind to loopback and inherit development-only access.
      Bind local exceptions to explicitly local hostnames and explicit address
      ranges before admitting the resolved peer.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [allow_local]
    cwe: [CWE-918]
    owasp: [A10:2021]
