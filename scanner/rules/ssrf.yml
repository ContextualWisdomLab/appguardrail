rules:
  - id: python-stored-ssrf-webhook-url
    patterns:
      - pattern-regex: '(?is)(?:\b(?P<unguarded_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P<unguarded_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=unguarded_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=unguarded_indent)[ \t]+[^\n]*\n){0,20}?(?P=unguarded_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))(?:(?!\bset_webhook\b).){0,800}?(?m:^(?P=unguarded_indent)\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=unguarded_var)\s*\))|\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])|\b(?P<webhook_url_var>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?:\([^\)\n]*\)|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)(?:\.get\s*\(\s*["\x27]url["\x27]\s*\)|\[\s*["\x27]url["\x27]\s*\])(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<reject_indent>[ \t]*)if\s+(?:(?P=webhook_url_var)\s+is\s+not\s+None\s+and\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?:(?P=webhook_url_var)\s+and\s+)?not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)|(?P=webhook_url_var)\s+not\s+in\s*\(\s*None\s*,\s*["\x27]["\x27]\s*\)\s+and\s*\(\s*not\s+isinstance\s*\(\s*(?P=webhook_url_var)\s*,\s*str\s*\)\s+or\s+not\s+_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)\s*\))(?:(?!:).){0,100}:\s*(?:#[^\n]*)?\n(?:(?P=reject_indent)[ \t]+[^\n]*\n){0,20}?(?P=reject_indent)[ \t]+\b(?:return|raise)\b))(?!(?:(?!\bset_webhook\b).){0,800}(?m:^(?P<guard_indent>[ \t]*)if\s+(?:(?!\bnot\b)[^\n:]){0,400}_is_safe_url\s*\(\s*(?P=webhook_url_var)\s*\)[^\n:]{0,100}:\s*(?:#[^\n]*)?\n(?:(?P=guard_indent)[ \t]+[^\n]*\n){0,20}?(?P=guard_indent)[ \t]+\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\)))(?:(?!\bset_webhook\b).){0,800}?\bset_webhook\s*\(\s*[^,\n]+,\s*[^,\n]+,\s*(?P=webhook_url_var)\s*\))'
    message: |
      A webhook URL is persisted directly from request data without an explicit
      validation boundary. Validate the URL with a fail-closed SSRF policy before
      storing it, and revalidate or pin the destination before outbound delivery.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [set_webhook]
    cwe: [CWE-918]
    owasp: [A10:2021]
  - id: python-ssrf-empty-host-fail-open
    patterns:
      - pattern-regex: '(?mx)^(?P<defindent>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)[^\n]*\n)*?^(?P<bodyindent>(?P=defindent)[ \t]+)(?P<host>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[^\n#]*\.hostname(?:(?:[ \t]+or[ \t]*["\x27]["\x27][ \t]*\)?[ \t]*(?:\.lower[ \t]*\([ \t]*\))?[ \t]*(?:\#[^\n]*)?\n)|(?:[ \t]*\)?[ \t]*(?:\#[^\n]*)?\n(?!(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)return[ \t]+True\b)[^\n]*\n)*?^(?P=bodyindent)if[ \t]+(?:\([ \t]*)?(?:(?P=host)[ \t]+is[ \t]+None\b|(?P=host)[ \t]*==[ \t]*None\b|(?P=host)[ \t]+in[ \t]*[\(\{\[][^\n:\]\}\)]*None[^\n:\]\}\)]*[\)\}\]])[ \t]*(?:\)[ \t]*)?(?:or\b[^:\n]*)?:(?:[ \t]*(?:return[ \t]+False|raise\b)[^\n]*|[ \t]*(?:\#[^\n]*)?\n(?:^[ \t]*\n|^[ \t]*\#[^\n]*\n)*^(?P<noneguardstmtindent>(?P=bodyindent)[ \t]+)(?:(?:return[ \t]+False|raise\b)[^\n]*|(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n(?:(?:^[ \t]*\n|^[ \t]*\#[^\n]*\n)|^(?P=noneguardstmtindent)(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n){0,6}^(?P=noneguardstmtindent)(?:return[ \t]+False|raise\b)[^\n]*)))))(?!(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)return[ \t]+True\b)[^\n]*\n)*?^(?P=bodyindent)if[ \t]+(?:\([ \t]*)?(?:not[ \t]+(?P=host)\b|(?P=host)[ \t]*==[ \t]*["\x27]["\x27]|(?P=host)[ \t]+in[ \t]*[\(\{\[][^\n:\]\}\)]*["\x27]["\x27][^\n:\]\}\)]*[\)\}\]])[ \t]*(?:\)[ \t]*)?(?:or\b[^:\n]*)?:(?:[ \t]*(?:return[ \t]+False|raise\b)[^\n]*|[ \t]*(?:\#[^\n]*)?\n(?:^[ \t]*\n|^[ \t]*\#[^\n]*\n)*^(?P<guardstmtindent>(?P=bodyindent)[ \t]+)(?:(?:return[ \t]+False|raise\b)[^\n]*|(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n(?:(?:^[ \t]*\n|^[ \t]*\#[^\n]*\n)|^(?P=guardstmtindent)(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n){0,6}^(?P=guardstmtindent)(?:return[ \t]+False|raise\b)[^\n]*)))(?:(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)[^\n]*\n)*?^(?P=bodyindent)(?P<dns>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=host)\b[^\n]*\n(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)[^\n]*\n)*?^[^\n]*\b(?:socket\.)?getaddrinfo[ \t]*\([ \t]*(?P=dns)\b[^\n]*\n|(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)[^\n]*\n)*?^[^\n]*\b(?:socket\.)?getaddrinfo[ \t]*\([ \t]*(?P=host)\b[^\n]*\n)(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=bodyindent)except\b)[^\n]*\n)*?^(?P=bodyindent)except[ \t]+(?:socket\.)?gaierror\b[^:\n]*:[ \t]*(?:\#[^\n]*)?\n(?:^[ \t]*\n|^(?P=bodyindent)[ \t]+\#[^\n]*\n){0,6}^(?P<gaiindent>(?P=bodyindent)[ \t]+)(?=\S)(?:return[ \t]+True\b[^\n]*|(?!(?:return|raise)\b)[^\n]*\n(?:(?:^[ \t]*\n|^(?P=gaiindent)\#[^\n]*\n|^(?P=gaiindent)(?!(?:return|raise)\b)[^\n]*\n|^(?P=gaiindent)[ \t]+[^\n]*\n)){0,12}(?:(?!^(?P=defindent)(?:async[ \t]+)?def\b|^(?P=defindent)class\b)(?!^(?P=gaiindent)(?:return|raise)\b)(?!^(?P=bodyindent)(?:return|raise)\b)[^\n]*\n)*?^(?P=bodyindent)return[ \t]+True\b)'
    message: |
      A Python URL validator can derive a missing or empty hostname, reach DNS
      resolution, ignore socket.gaierror, and later return success without an
      unconditional missing/empty-host rejection. Reject absent parsed hostnames
      before DNS resolution and fail closed when a safe public destination cannot
      be established.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [hostname, getaddrinfo, gaierror]
    cwe: [CWE-918]
    owasp: [A10:2021]
