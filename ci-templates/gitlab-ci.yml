# AppGuardrail security scan for GitLab CI/CD
#
# Copy this file to your repository root as `.gitlab-ci.yml` (or paste the
# `appguardrail` job into your existing pipeline).
#
# What it does:
#   - Installs AppGuardrail from PyPI on a Python image.
#   - Scans the whole checkout and writes a SARIF 2.1.0 report.
#   - Fails the job when AppGuardrail finds deploy-blocking (CRITICAL/HIGH)
#     issues, because `scan` exits non-zero in that case.
#
# The SARIF file is kept as a build artifact so you can download it or feed it
# into any SARIF-aware viewer.

stages:
  - security

appguardrail:
  stage: security
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check appguardrail
    # Exit code is 0 when clean, non-zero on deploy-blocking findings, which
    # fails the job. The SARIF report is written either way.
    - python -m scanner.cli.appguardrail scan --sarif appguardrail.sarif .
  artifacts:
    when: always
    paths:
      - appguardrail.sarif
    expire_in: 30 days
