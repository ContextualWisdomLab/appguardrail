name: Repair Scanner Context Precision 1299

on:
  push:
    branches:
      - fix/scanner-test-context-marker-precision-1299
    paths:
      - .github/workflows/repair-scanner-context-precision-1299.yml

permissions:
  contents: write

concurrency:
  group: repair-scanner-context-precision-1299-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact owner head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard retained RED and exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 333c4ce0b2eb1685d04d3c96860e3bbed4542dd8 "$GITHUB_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install reproducible test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Reproduce colocated-test context RED
        shell: bash
        run: |
          set -euo pipefail
          if python -m pytest -q tests/test_scanner_context_precision.py; then
            echo 'Expected colocated test-context regression to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum scanner context repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('scanner/cli/appguardrail.py')
          source = path.read_text()
          before = '''    if path.startswith("tests/") or "/tests/" in path:
              return "test"
          '''
          after = '''    if path.startswith("tests/") or "/tests/" in path:
              return "test"
          filename = path.rsplit("/", 1)[-1].lower()
          if (
              ".test." in filename
              or ".spec." in filename
              or filename.endswith((".test", ".spec"))
          ):
              return "test"
          '''
          if source.count(before) != 1:
              raise SystemExit('finding-context anchor changed')
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Prove owner GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_scanner_context_precision.py
          python -m pytest -q
          git diff --check

      - name: Guard bounded delta and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-scanner-context-precision-1299.yml
          git add scanner/cli/appguardrail.py
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-scanner-context-precision-1299.yml' \
            'scanner/cli/appguardrail.py' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --cached --check

      - name: Publish ordinary owner descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(scanner): classify colocated test files as test context'
          git push origin "HEAD:${GITHUB_REF_NAME}"
