name: Integrate Python shell AST detector

on:
  push:
    branches:
      - security/python-shell-ast-983
    paths:
      - .github/workflows/repair-python-shell-ast-983.yml

permissions:
  contents: read

concurrency:
  group: repair-python-shell-ast-983-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/security/python-shell-ast-983'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 4fbc92fb295b632f8c77c50d3b21f1dc56aaef74
      TARGET_BRANCH: security/python-shell-ast-983
    steps:
      - name: Check out exact integration trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-python-shell-coverage.txt

      - name: Install immutable test and coverage tools
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-python-shell-coverage.txt

      - name: Verify detector core GREEN before scanner wiring
        run: >-
          python -m pytest -q tests/test_python_command_injection_ast.py
          -k 'not scanner_emits_one_normalized_ast_finding and not scanner_keeps_regex_rules_beside_ast_findings'

      - name: Confirm scanner integration RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_python_command_injection_ast.py::test_scanner_emits_one_normalized_ast_finding \
            >"${RUNNER_TEMP}/python-shell-scanner-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/python-shell-scanner-red.log"
          test "$status" -ne 0
          grep -F 'test_scanner_emits_one_normalized_ast_finding' \
            "${RUNNER_TEMP}/python-shell-scanner-red.log"
          if grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError' \
            "${RUNNER_TEMP}/python-shell-scanner-red.log"; then
            echo '::error::RED evidence was a collection/import failure.'
            exit 1
          fi

      - name: Wire AST evidence into the production scanner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scanner/cli/appguardrail.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from appguardrail_core.findings import normalize_findings\n"
          import_block = '''from appguardrail_core.findings import normalize_findings
          from appguardrail_core.python_shell_detector import (
              PYTHON_COMMAND_INJECTION_MESSAGE,
              find_python_shell_calls,
          )
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit("Python shell detector import boundary drifted")
          text = text.replace(import_anchor, import_block, 1)

          regex_rule = '''    {
              "id": "python-command-injection",
              "pattern": re.compile(
                  r"(?is)(?:\\bos\\.(?:system|popen)\\s*\\(|\\bsubprocess\\.(?:Popen|run|call|check_call|check_output)\\s*\\((?:[^()]|\\([^()]*\\)){0,1200}\\bshell\\s*=\\s*True)"
              ),
              "severity": "CRITICAL",
              "message": "Potential command injection sink detected: os.system/os.popen execute through a shell, and subprocess shell=True invokes a shell. Avoid shell execution, validate untrusted input, and use argument arrays where possible. [OWASP A03:2021 - Injection]",
              "extensions": [".py"],
          },
          '''
          if text.count(regex_rule) != 1:
              raise SystemExit("legacy Python command-injection regex boundary drifted")
          text = text.replace(regex_rule, "", 1)

          rule_gate = '''    applicable_rules = [
                  rule
                  for rule in SCAN_RULES
                  if rule["extensions"] is None or ext in rule["extensions"]
              ]
              if not applicable_rules:
                  return findings

              rel_path_str = None
          '''
          new_rule_gate = '''    applicable_rules = [
                  rule
                  for rule in SCAN_RULES
                  if rule["extensions"] is None or ext in rule["extensions"]
              ]
              python_shell_ast_enabled = ext == ".py"
              if not applicable_rules and not python_shell_ast_enabled:
                  return findings

              rel_path_str = None
          '''
          if text.count(rule_gate) != 1:
              raise SystemExit("scanner applicable-rule gate drifted")
          text = text.replace(rule_gate, new_rule_gate, 1)

          content_boundary = '''            if not content:
                      return findings
                  count_newlines = content.count
          '''
          ast_boundary = '''            if not content:
                      return findings
                  if python_shell_ast_enabled:
                      shell_calls = find_python_shell_calls(content)
                      if shell_calls and rel_path_str is None:
                          rel_path_str = _sanitize_terminal_output(
                              _display_path(context.relative_candidate(file_path))
                          )
                      for shell_call in shell_calls:
                          findings.append(
                              _build_finding(
                                  "appguardrail-python-ast",
                                  "python-command-injection",
                                  "CRITICAL",
                                  PYTHON_COMMAND_INJECTION_MESSAGE,
                                  rel_path_str,
                                  shell_call.line,
                                  shell_call.snippet,
                              )
                          )
                  if not applicable_rules:
                      return findings
                  count_newlines = content.count
          '''
          if text.count(content_boundary) != 1:
              raise SystemExit("scanner content boundary drifted")
          path.write_text(
              text.replace(content_boundary, ast_boundary, 1),
              encoding="utf-8",
          )
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_python_command_injection_ast.py
          coverage erase
          coverage run --branch \
            --source=appguardrail_core.python_shell_detector \
            -m pytest -q tests/test_python_command_injection_ast.py
          coverage report --show-missing --fail-under=100 \
            --include=appguardrail_core/python_shell_detector.py
          python -m pytest -q
          python -m compileall -q \
            appguardrail_core/python_shell_detector.py \
            scanner/cli/appguardrail.py \
            tests/test_python_command_injection_ast.py
          git diff --check

      - name: Publish verified integration and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-python-shell-ast-983.yml
          git add -A
          git config user.name "CWL One-shot Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sast): parse Python shell calls through AST"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http."https://github.com/".extraheader="${auth_header}" \
            push origin "HEAD:refs/heads/${TARGET_BRANCH}"
