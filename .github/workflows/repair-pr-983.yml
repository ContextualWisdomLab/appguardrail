name: Repair PR 983 command-injection contract

on:
  push:
    branches:
      - sentinel-fix-python-command-injection-regex-727217014950515043

permissions:
  contents: write

concurrency:
  group: repair-pr-983-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sentinel-fix-python-command-injection-regex-727217014950515043
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Apply exact review repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path("scanner/cli/appguardrail.py")
          scanner = scanner_path.read_text(encoding="utf-8")
          old_message = (
              '        "message": "Potential Command Injection detected: shell=True used in '
              'Python subprocess/os command. [OWASP A03:2021 - Injection]",\n'
          )
          new_message = (
              '        "message": "Potential command injection detected: os.system/os.popen '
              'execute through a shell, or a subprocess API was invoked with shell=True. '
              '[OWASP A03:2021 - Injection]",\n'
          )
          if scanner.count(old_message) != 1:
              raise SystemExit("expected exactly one legacy command-injection message")
          scanner_path.write_text(scanner.replace(old_message, new_message), encoding="utf-8")

          journal_path = Path(".jules/sentinel.md")
          journal = journal_path.read_text(encoding="utf-8")
          old_prevention = (
              "**Prevention:** Ensure static analysis regex rules handling different APIs group "
              "them accurately according to their respective signatures rather than merging them "
              "under a single mandatory condition (like `shell=True`). Added tests to prevent "
              "regression."
          )
          new_prevention = (
              "**Prevention:** Keep the API branches explicit: all direct `os.system`/`os.popen` "
              "calls are review findings because those APIs always invoke a shell, while "
              "`subprocess` is reported by this rule only when `shell=True` is present. The "
              "finding text must describe that distinction, and independent regressions must "
              "cover each API plus a safe `shell=False` boundary."
          )
          if journal.count(old_prevention) != 1:
              raise SystemExit("expected exactly one legacy prevention paragraph")
          journal_path.write_text(
              journal.replace(old_prevention, new_prevention), encoding="utf-8"
          )
          PY

          cat > tests/test_python_command_injection_rule.py <<'PY'
          """Focused contracts for Python shell-spawning command-injection findings."""

          import pytest

          from scanner.cli.appguardrail import _scan_file


          EXPECTED_MESSAGE = (
              "Potential command injection detected: os.system/os.popen execute through a shell, "
              "or a subprocess API was invoked with shell=True. "
              "[OWASP A03:2021 - Injection]"
          )


          @pytest.mark.parametrize(
              ("filename", "source"),
              [
                  ("os_system.py", "os.system('id')\n"),
                  ("os_popen.py", "os.popen(command)\n"),
                  ("subprocess_shell.py", "subprocess.call(command, shell=True)\n"),
              ],
          )
          def test_python_shell_spawning_apis_are_detected_independently(
              tmp_path, filename, source
          ):
              """Require each supported shell-spawning API shape to trigger on its own."""
              source_path = tmp_path / filename
              source_path.write_text(source, encoding="utf-8")

              matches = [
                  finding
                  for finding in _scan_file(source_path, tmp_path)
                  if finding["rule_id"] == "python-command-injection"
              ]

              assert len(matches) == 1
              assert matches[0]["message"] == EXPECTED_MESSAGE


          @pytest.mark.parametrize(
              "source",
              [
                  "subprocess.call(['id'], shell=False)\n",
                  "subprocess.run(['id'])\n",
              ],
          )
          def test_python_subprocess_without_shell_true_is_not_reported(tmp_path, source):
              """Keep ordinary non-shell subprocess execution outside this detector."""
              source_path = tmp_path / "safe_subprocess.py"
              source_path.write_text(source, encoding="utf-8")

              rule_ids = {
                  finding["rule_id"] for finding in _scan_file(source_path, tmp_path)
              }

              assert "python-command-injection" not in rule_ids
          PY
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify focused and existing command-injection contracts
        run: >-
          python -m pytest -q
          tests/test_python_command_injection_rule.py
          tests/test_appguardrail.py::test_scan_file_detects_strix_derived_patterns
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/cli/appguardrail.py .jules/sentinel.md tests/test_python_command_injection_rule.py
          if git diff --cached --quiet; then
            echo "No repair changes remained"
            exit 0
          fi
          git commit -m "fix(sast): distinguish Python shell execution APIs"
          git push origin HEAD:sentinel-fix-python-command-injection-regex-727217014950515043
