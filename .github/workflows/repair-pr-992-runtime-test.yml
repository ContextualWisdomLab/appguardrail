name: Repair PR 992 runtime DOM-XSS regression

on:
  push:
    branches:
      - sentinel-xss-console-11100301982132123366
    paths:
      - .github/workflows/repair-pr-992-runtime-test.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-992-runtime-xss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/sentinel-xss-console-11100301982132123366'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: sentinel-xss-console-11100301982132123366
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install immutable test toolchain
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Correct the runtime assertion boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_console_xss_contract.py")
          tests = test_path.read_text(encoding="utf-8")

          old_error_contract = "        '${esc(e.message)}',\n"
          new_error_contract = (
              "        \"Error loading details: '+esc(e.message)+'</div>\",\n"
          )
          if tests.count(old_error_contract) != 1:
              raise SystemExit("console error-escaping contract boundary drifted")
          tests = tests.replace(old_error_contract, new_error_contract, 1)

          old_completion = (
              '  .then(()=>{{document.documentElement.dataset.testComplete="1";}})\n'
          )
          new_completion = (
              '  .then(()=>{{\n'
              '    const sourceScript=document.querySelector("script");\n'
              '    if(sourceScript)sourceScript.textContent="";\n'
              '    document.documentElement.dataset.testComplete="1";\n'
              '  }})\n'
          )
          if tests.count(old_completion) != 1:
              raise SystemExit("browser completion boundary drifted")
          test_path.write_text(
              tests.replace(old_completion, new_completion, 1),
              encoding="utf-8",
          )
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python -m pytest -q tests/test_console_xss_contract.py
          python -m pytest -q tests
          python -m compileall -q appguardrail_core scanner tests
          git diff --check

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-992-runtime-test.yml
          git add -A
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(console): execute hostile DOM payloads"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
