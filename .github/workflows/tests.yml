name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Recompile with:
        # uv pip compile --generate-hashes --universal --python-version 3.11 requirements-test.in -o requirements-test.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify 100% statement coverage for live drift modules
        if: matrix.python-version == '3.13'
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/code_scanning.py \
            --module scripts/ci/collect_code_scanning_drift.py \
            --test tests/test_code_scanning_core.py \
            --test tests/test_code_scanning_coverage_edges.py \
            --test tests/test_code_scanning_drift_collector.py \
            --test tests/test_code_scanning_drift_issueops.py \
            --test tests/test_code_scanning_drift_release_contract.py \
            --test tests/test_code_scanning_drift_transport_edges.py \
            --test tests/test_code_scanning_drift_workflow.py \
            --test tests/test_code_scanning_module_entrypoint.py \
            --test tests/test_code_scanning_operational_hardening.py \
            --test tests/test_code_scanning_page_result_issue_index.py \
            --test tests/test_code_scanning_remaining_coverage.py \
            --test tests/test_code_scanning_review_regressions.py

  semgrep-rule-validation:
    name: Semgrep rule validation (1.170.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate packaged path-canonicalization rules
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -euo pipefail
          image="semgrep/semgrep@sha256:f42392ee2c00f0de06702135e0e20415f481935900790fbe37aa778591be3999"
          version="$(docker run --rm --platform linux/amd64 --entrypoint semgrep "$image" --version)"
          test "$version" = "1.170.0"
          docker run --rm \
            --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            --entrypoint semgrep \
            "$image" \
            --metrics off \
            --validate \
            --config scanner/rules/path_canonicalization.yml
