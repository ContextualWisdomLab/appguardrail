name: Apply Verified Code Scanning Source Artifact
# Second branch push intentionally activates this one-shot workflow.

on:
  push:
    branches: [feat/code-scanning-analysis-drift-862]
    paths: [.github/workflows/apply-code-scanning-source-artifact.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: apply-code-scanning-source-artifact
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'seonghobae' && github.ref == 'refs/heads/feat/code-scanning-analysis-drift-862'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERIFIED_ARTIFACT_ID: "8879126814"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/code-scanning-analysis-drift-862
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-locked tests
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Download and verify reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/verified-source.zip"
          mkdir -p "$RUNNER_TEMP/verified-source"
          unzip -q "$RUNNER_TEMP/verified-source.zip" -d "$RUNNER_TEMP/verified-source"
          echo "3f3fd3ec646fdc24caf9bb983cd36f4d5d686b9729ae8b82a0f1050be29a3f9d  $RUNNER_TEMP/verified-source/.github/workflows/org-security-failure-collector.yml" | sha256sum --check --strict
          echo "a92eb56d2aa4a7406984954ea424fe4e0759cbe0c6bf9a234625c70430c5f6f0  $RUNNER_TEMP/verified-source/.github/workflows/tests.yml" | sha256sum --check --strict
          echo "90b7cdacb0b0c8bbcbe9eb1e552738441efe5d497736373ed8db60714bc35215  $RUNNER_TEMP/verified-source/scripts/ci/collect_code_scanning_drift.py" | sha256sum --check --strict
          echo "a3a94ec10d27890481791711469b60d1444bfa4d4dae69da3625b44e168ce2a9  $RUNNER_TEMP/verified-source/tests/test_code_scanning_coverage_edges.py" | sha256sum --check --strict
      - name: Reproduce verified tree and validation
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/verified-source/.github/workflows/org-security-failure-collector.yml" .github/workflows/
          cp "$RUNNER_TEMP/verified-source/.github/workflows/tests.yml" .github/workflows/
          cp "$RUNNER_TEMP/verified-source/scripts/ci/collect_code_scanning_drift.py" scripts/ci/
          cp "$RUNNER_TEMP/verified-source/tests/test_code_scanning_coverage_edges.py" tests/
          git diff --check
          python -m pytest -q
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/code_scanning.py \
            --module scripts/ci/collect_code_scanning_drift.py \
            --test tests/test_code_scanning_core.py \
            --test tests/test_code_scanning_coverage_edges.py \
            --test tests/test_code_scanning_drift_collector.py \
            --test tests/test_code_scanning_drift_issueops.py \
            --test tests/test_code_scanning_drift_release_contract.py \
            --test tests/test_code_scanning_drift_transport_edges.py \
            --test tests/test_code_scanning_drift_workflow.py \
            --test tests/test_code_scanning_module_entrypoint.py \
            --test tests/test_code_scanning_operational_hardening.py \
            --test tests/test_code_scanning_page_result_issue_index.py \
            --test tests/test_code_scanning_remaining_coverage.py \
            --test tests/test_code_scanning_review_regressions.py
      - name: Commit verified non-workflow sources
        run: |
          set -euo pipefail
          git add \
            scripts/ci/collect_code_scanning_drift.py \
            tests/test_code_scanning_coverage_edges.py
          git diff --cached --check
          git config user.name 'appguardrail-maintainer'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git commit -m 'fix(code-scanning): validate collector inputs'
          git push origin HEAD:feat/code-scanning-analysis-drift-862
