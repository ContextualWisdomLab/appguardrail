name: Publish Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify protected release source
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          protected_sha="$(git rev-parse origin/develop)"
          if [ "$GITHUB_SHA" != "$protected_sha" ]; then
            echo "::error::Release source $GITHUB_SHA is not the exact current protected develop tip $protected_sha."
            exit 1
          fi

          project_version="$(python -c 'import re; from pathlib import Path; source = Path("scanner/cli/appguardrail.py").read_text(encoding="utf-8"); match = re.search(r"^__version__ = \\\"([^\\\"]+)\\\"$", source, re.MULTILINE); assert match is not None, "missing __version__"; print(match.group(1))')"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
                echo "::error::Manual publication must be dispatched from refs/heads/develop, not $GITHUB_REF."
                exit 1
              fi
              ;;
            push)
              if [ "$GITHUB_REF" != "refs/tags/v${project_version}" ]; then
                echo "::error::Release tag $GITHUB_REF does not match package version v${project_version}."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported release event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Install build tooling
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-release.txt

      - name: Audit release build tooling
        run: |
          python -m pip_audit --local --vulnerability-service osv --progress-spinner off

      - name: Build package distributions
        run: |
          python -m build

      - name: Check package distributions
        run: |
          python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          set -euo pipefail
          smoke_env="$RUNNER_TEMP/appguardrail-release-smoke"
          python -m venv "$RUNNER_TEMP/appguardrail-release-smoke"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/appguardrail" --version
          "$smoke_env/bin/python" - <<'PY'
          from importlib.resources import files

          rules = files("scanner.rules")
          assert any(item.name.endswith(".yml") for item in rules.iterdir()), (
              "packaged wheel is missing scanner rules"
          )
          scanner = files("scanner")
          # scanner/dashboard resources are part of the published wheel contract.
          assert (scanner / "dashboard" / "index.html").is_file()
          assert (scanner / "dashboard" / "console.html").is_file()
          PY

      - name: Generate release SBOM and provenance
        run: |
          set -euo pipefail
          cyclonedx-py environment "$(python -c 'import sys; print(sys.executable)')" --output-reproducible --output-format JSON --output-file release-sbom.cdx.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          def file_record(path: Path) -> dict[str, object]:
              return {
                  "path": str(path),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }

          dist = [file_record(path) for path in sorted(Path("dist").glob("*")) if path.is_file()]
          if not dist:
              raise SystemExit("no package distributions were built")

          payload = {
              "schema": "https://contextualwisdomlab.github.io/appguardrail/release-provenance/v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "python": {
                  "executable": sys.executable,
                  "version": sys.version,
                  "platform": platform.platform(),
              },
              "release_requirements": file_record(Path("requirements-release.txt")),
              "dist": dist,
          }
          Path("release-provenance.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain-evidence
          path: |
            release-sbom.cdx.json
            release-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/appguardrail/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
