name: Repair retention schema review once

on:
  push:
    branches:
      - feat/retention-schema-871

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/retention-schema-871
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Remove unreachable generated coverage guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/repair_retention_review_once.py")
          text = path.read_text(encoding="utf-8")
          old = '''        connection.commit()
                  transaction_started = False
              except Exception as exc:
                  if transaction_started and connection.in_transaction:
                      connection.rollback()
                  if isinstance(exc, SchemaMigrationError):
                      raise
                  raise SchemaMigrationError("control-plane schema migration failed") from exc

              if locked is None:  # pragma: no cover - guarded by the transaction flow above
                  raise SchemaMigrationError("schema inspection did not complete")
              return SchemaMigrationResult(
                  previous_version=locked.user_version,
                  current_version=CURRENT_SCHEMA_VERSION,
                  changed=True,
                  migrated_legacy_schema=schema_kind == "legacy",
              )
          '''.replace("              ", "")
          new = '''        connection.commit()
                  transaction_started = False
                  return SchemaMigrationResult(
                      previous_version=locked.user_version,
                      current_version=CURRENT_SCHEMA_VERSION,
                      changed=True,
                      migrated_legacy_schema=schema_kind == "legacy",
                  )
              except Exception as exc:
                  if transaction_started and connection.in_transaction:
                      connection.rollback()
                  if isinstance(exc, SchemaMigrationError):
                      raise
                  raise SchemaMigrationError("control-plane schema migration failed") from exc
          '''.replace("              ", "")
          if text.count(old) != 1:
              raise SystemExit("generated migration coverage contract changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply bounded review fixes
        run: python scripts/ci/repair_retention_review_once.py
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify focused, coverage, and full contracts
        run: |
          python -m pytest -q tests/test_controlplane_schema_migration.py tests/test_controlplane_schema_failure_edges.py tests/test_controlplane_schema_coverage_edges.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/controlplane_schema.py \
            --test tests/test_controlplane_schema_migration.py \
            --test tests/test_controlplane_schema_failure_edges.py \
            --test tests/test_controlplane_schema_contract.py \
            --test tests/test_controlplane_schema_coverage_edges.py \
            --test tests/test_controlplane_schema_release_contract.py
          python -m pytest -q
          python -m compileall -q appguardrail_core scanner scripts tests
          git diff --check
      - name: Commit verified repair and remove one-shot files
        run: |
          rm .github/workflows/repair-retention-review-once.yml
          rm scripts/ci/repair_retention_review_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appguardrail_core/controlplane_schema.py tests/test_controlplane_schema_migration.py tests/test_controlplane_schema_failure_edges.py tests/test_controlplane_schema_coverage_edges.py docs/controlplane-schema-migration.md CHANGELOG.d/871-retention-schema-migration.md .github/workflows/repair-retention-review-once.yml scripts/ci/repair_retention_review_once.py
          git commit -m "fix(schema): serialize migration and retain audit events"
          git push origin HEAD:feat/retention-schema-871
