name: Repair retention schema contracts once

on:
  push:
    branches:
      - feat/retention-schema-871

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/retention-schema-871
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Align contracts to the reviewed production schema
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              Path("tests/test_controlplane_schema_migration.py"): [
                  ("repo TEXT NOT NULL,\n    commit TEXT NOT NULL,\n    total_findings INTEGER NOT NULL,", "repo TEXT,\n    commit_sha TEXT,\n    total INTEGER NOT NULL,"),
                  ("findings_json TEXT NOT NULL DEFAULT '[]'", "findings TEXT NOT NULL"),
                  ("INSERT INTO scans(org_id, created_at, repo, commit, total_findings, ", "INSERT INTO scans(org_id, created_at, repo, commit_sha, total, "),
                  ("deploy_blocking, severity_counts, new_blocking, findings_json) ", "deploy_blocking, severity_counts, new_blocking, findings) "),
                  ("SELECT id, org_id, created_at, repo, commit, total_findings, ", "SELECT id, org_id, created_at, repo, commit_sha, total, "),
                  ("deploy_blocking, severity_counts, new_blocking, findings_json ", "deploy_blocking, severity_counts, new_blocking, findings "),
              ],
              Path("tests/test_controlplane_schema_failure_edges.py"): [
                  ("repo TEXT NOT NULL,\n            commit TEXT NOT NULL,\n            total_findings INTEGER NOT NULL,", "repo TEXT,\n            commit_sha TEXT,\n            total INTEGER NOT NULL,"),
                  ("findings_json TEXT NOT NULL DEFAULT '[]'", "findings TEXT NOT NULL"),
                  ("INSERT INTO scans(org_id, created_at, repo, commit, total_findings, ", "INSERT INTO scans(org_id, created_at, repo, commit_sha, total, "),
                  ("deploy_blocking, severity_counts, new_blocking, findings_json) ", "deploy_blocking, severity_counts, new_blocking, findings) "),
              ],
              Path("appguardrail_core/controlplane_schema.py"): [
                  ('            "commit",\n            "total_findings",', '            "commit_sha",\n            "total",'),
                  ('            "findings_json",', '            "findings",'),
                  ("            repo TEXT NOT NULL,\n            commit TEXT NOT NULL,\n            total_findings INTEGER NOT NULL,", "            repo TEXT,\n            commit_sha TEXT,\n            total INTEGER NOT NULL,"),
                  ("            findings_json TEXT NOT NULL DEFAULT '[]'", "            findings TEXT NOT NULL"),
                  ('                str(row[1])\n                for row in connection.execute(\n                    f"PRAGMA table_info({_quoted_identifier(table_name)})"\n                )', '                str(row[0])\n                for row in connection.execute(\n                    "SELECT name FROM pragma_table_info(?)", (table_name,)\n                )'),
                  ('        connection.execute(f"PRAGMA user_version = {CURRENT_SCHEMA_VERSION}")', '        connection.execute("PRAGMA user_version = 2")'),
              ],
          }

          for path, replacements in files.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"missing expected contract in {path}: {old[:100]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify migration and full repository
        run: |
          python -m pytest -q tests/test_controlplane_schema_migration.py tests/test_controlplane_schema_failure_edges.py
          python -m pytest -q
          python -m compileall -q appguardrail_core scanner scripts tests
          git diff --check
      - name: Commit verified repair and remove one-shot workflow
        run: |
          rm .github/workflows/repair-retention-schema-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appguardrail_core/controlplane_schema.py tests/test_controlplane_schema_migration.py tests/test_controlplane_schema_failure_edges.py .github/workflows/repair-retention-schema-once.yml
          git commit -m "fix(schema): align migration with production columns"
          git push origin HEAD:feat/retention-schema-871
