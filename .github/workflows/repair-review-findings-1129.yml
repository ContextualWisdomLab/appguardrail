name: Repair review findings 1129

on:
  push:
    branches:
      - security/cwl-issue-detector-families
    paths:
      - .github/workflows/repair-review-findings-1129.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify writer input lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "01a375857da37f335239bf3ca342c7b6793f853e"
          remote_head="$(git ls-remote origin refs/heads/security/cwl-issue-detector-families | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Apply minimum causal repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scanner = Path('scanner/cli/appguardrail.py')
          scanner_text = scanner.read_text(encoding='utf-8')
          old_regex = '_PASSWORD_INDIRECTION_RE = re.compile(r""":\'[\\\"]|["\']\\$""")'
          new_regex = '_PASSWORD_INDIRECTION_RE = re.compile(r"""(?<=\\s):\'[\\\"]|["\']\\$""")'
          if scanner_text.count(old_regex) != 1:
              raise SystemExit('expected password-indirection regex not found exactly once')
          scanner.write_text(scanner_text.replace(old_regex, new_regex), encoding='utf-8')

          detector = Path('appguardrail_core/claude_plugin_detector.py')
          detector_text = detector.read_text(encoding='utf-8')
          old_budget = '''        file_count += 1
                  scanned_byte_count += len(payload)
              return hasher.hexdigest(), file_count, scanned_byte_count
          '''
          new_budget = '''        file_count += 1
                  scanned_byte_count += len(payload)
                  if file_count > _MAX_PACKAGE_FILES or scanned_byte_count > _MAX_PACKAGE_BYTES:
                      break
              return hasher.hexdigest(), file_count, scanned_byte_count
          '''
          if detector_text.count(old_budget) != 1:
              raise SystemExit('expected artifact digest tail not found exactly once')
          detector_text = detector_text.replace(old_budget, new_budget)
          old_license = 'path.name.upper().startswith("LICENSE")'
          new_license = 'path.name.upper().startswith(("LICENSE", "NOTICE"))'
          if detector_text.count(old_license) != 1:
              raise SystemExit('expected license predicate not found exactly once')
          detector.write_text(detector_text.replace(old_license, new_license), encoding='utf-8')
          PY
      - name: Verify focused REDs and unchanged controls
        run: |
          python -m pytest -q \
            tests/test_password_indirection_precision.py \
            tests/test_claude_plugin_review_regressions.py \
            tests/test_claude_plugin_supply_chain.py
      - name: Verify scanner and detector syntax
        run: python -m py_compile scanner/cli/appguardrail.py appguardrail_core/claude_plugin_detector.py
      - name: Retire writer and publish tested candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-review-findings-1129.yml
          git diff --check
          remote_head="$(git ls-remote origin refs/heads/security/cwl-issue-detector-families | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(scanner): bound review finding regressions'
          git push origin HEAD:security/cwl-issue-detector-families
