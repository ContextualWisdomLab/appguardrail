name: Repair Code Scanning Operational Hardening
# This temporary branch-local workflow exports only fully verified source files.

on:
  push:
    branches: [feat/code-scanning-analysis-drift-862]
    paths: [.github/workflows/repair-code-scanning-operational-hardening.yml]

permissions:
  contents: read

concurrency:
  group: repair-code-scanning-operational-hardening
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'seonghobae' && github.ref == 'refs/heads/feat/code-scanning-analysis-drift-862'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/code-scanning-analysis-drift-862
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-locked tests
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Apply reviewed operational fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str) -> None:
              """Replace one exact reviewed source fragment or fail closed."""
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(
                      f"expected exactly one reviewed replacement in {path_text}: {old!r}"
                  )
              path.write_text(source.replace(old, new), encoding="utf-8")

          collector_path = Path("scripts/ci/collect_code_scanning_drift.py")
          collector = collector_path.read_text(encoding="utf-8")

          old_label = (
              '    except RuntimeError as exc:\n'
              '        if "422" not in str(exc):\n'
              '            raise\n'
          )
          new_label = (
              '    except GitHubAPIError as exc:\n'
              '        if exc.status != 422:\n'
              '            raise\n'
          )
          if collector.count(old_label) != 1:
              raise SystemExit("expected one legacy label error handler")
          collector = collector.replace(old_label, new_label)

          parse_marker = "\n\ndef parse_args(argv: list[str]) -> argparse.Namespace:\n"
          if collector.count(parse_marker) != 1:
              raise SystemExit("expected one parse_args marker")
          positive_integer_helper = (
              "\n\ndef _positive_int(value: str) -> int:\n"
              '    """Parse one strictly positive integer for bounded collector options."""\n'
              "    try:\n"
              "        parsed = int(value)\n"
              "    except ValueError as exc:\n"
              "        raise argparse.ArgumentTypeError(\n"
              '            "value must be a positive integer"\n'
              "        ) from exc\n"
              "    if parsed <= 0:\n"
              '        raise argparse.ArgumentTypeError("value must be a positive integer")\n'
              "    return parsed\n"
          )
          collector = collector.replace(
              parse_marker,
              positive_integer_helper + parse_marker,
          )

          old_argument = (
              '    parser.add_argument(\n'
              '        "--max-pull-requests",\n'
              '        type=int,\n'
              '        default=int(\n'
              '            os.getenv(\n'
              '                "CODE_SCANNING_DRIFT_MAX_PULL_REQUESTS",\n'
              '                str(DEFAULT_MAX_PULL_REQUESTS),\n'
              '            )\n'
              '        ),\n'
              '    )\n'
          )
          new_argument = (
              '    parser.add_argument(\n'
              '        "--max-pull-requests",\n'
              '        type=_positive_int,\n'
              '        default=os.getenv(\n'
              '            "CODE_SCANNING_DRIFT_MAX_PULL_REQUESTS",\n'
              '            str(DEFAULT_MAX_PULL_REQUESTS),\n'
              '        ),\n'
              '    )\n'
          )
          if collector.count(old_argument) != 1:
              raise SystemExit("expected one max-pull-requests argument block")
          collector_path.write_text(
              collector.replace(old_argument, new_argument),
              encoding="utf-8",
          )

          replace_once(
              ".github/workflows/org-security-failure-collector.yml",
              '            --repositories "$CODE_SCANNING_DRIFT_REPOSITORIES"\n',
              '            --repositories "$CODE_SCANNING_DRIFT_REPOSITORIES" \\\n'
              '            --max-pull-requests "50"\n',
          )

          replace_once(
              ".github/workflows/tests.yml",
              '            --test tests/test_code_scanning_module_entrypoint.py \\\n',
              '            --test tests/test_code_scanning_module_entrypoint.py \\\n'
              '            --test tests/test_code_scanning_operational_hardening.py \\\n',
          )

          test_path = Path("tests/test_code_scanning_coverage_edges.py")
          test_source = test_path.read_text(encoding="utf-8")
          function_start = test_source.index(
              "def test_label_creation_tolerates_duplicate_only() -> None:\n"
          )
          function_end = test_source.index(
              "\n\ndef test_publish_reopens_changed_closed_issue_and_bounds_updates",
              function_start,
          )
          replacement_function = '''def test_label_creation_tolerates_duplicate_only() -> None:
              """GitHub's existing-label response is harmless while other failures propagate."""

              class LabelClient:
                  """Raise one typed GitHub response for label creation."""

                  def __init__(self, status: int) -> None:
                      """Store the response status."""
                      self.status = status

                  def request(self, *_args, **_kwargs):
                      """Raise the configured typed response."""
                      raise drift.GitHubAPIError(self.status)

              drift._ensure_label(
                  LabelClient(422), "ContextualWisdomLab/appguardrail", "x"
              )
              with pytest.raises(drift.GitHubAPIError) as exc_info:
                  drift._ensure_label(
                      LabelClient(500), "ContextualWisdomLab/appguardrail", "x"
                  )
              assert exc_info.value.status == 500
          '''
          replacement_function = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in replacement_function.splitlines()
          ) + "\n"
          test_path.write_text(
              test_source[:function_start]
              + replacement_function
              + test_source[function_end:],
              encoding="utf-8",
          )
          PY
          git diff --check
      - name: Verify full and exact coverage suites
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/code_scanning.py \
            --module scripts/ci/collect_code_scanning_drift.py \
            --test tests/test_code_scanning_core.py \
            --test tests/test_code_scanning_coverage_edges.py \
            --test tests/test_code_scanning_drift_collector.py \
            --test tests/test_code_scanning_drift_issueops.py \
            --test tests/test_code_scanning_drift_release_contract.py \
            --test tests/test_code_scanning_drift_transport_edges.py \
            --test tests/test_code_scanning_drift_workflow.py \
            --test tests/test_code_scanning_module_entrypoint.py \
            --test tests/test_code_scanning_operational_hardening.py \
            --test tests/test_code_scanning_page_result_issue_index.py \
            --test tests/test_code_scanning_remaining_coverage.py \
            --test tests/test_code_scanning_review_regressions.py
      - name: Stage verified source artifact
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/code-scanning-operational-fix"
          mkdir -p \
            "$artifact_root/.github/workflows" \
            "$artifact_root/scripts/ci" \
            "$artifact_root/tests"
          cp .github/workflows/org-security-failure-collector.yml \
            "$artifact_root/.github/workflows/"
          cp .github/workflows/tests.yml "$artifact_root/.github/workflows/"
          cp scripts/ci/collect_code_scanning_drift.py "$artifact_root/scripts/ci/"
          cp tests/test_code_scanning_coverage_edges.py "$artifact_root/tests/"
          git diff --binary -- \
            .github/workflows/org-security-failure-collector.yml \
            .github/workflows/tests.yml \
            scripts/ci/collect_code_scanning_drift.py \
            tests/test_code_scanning_coverage_edges.py \
            > "$artifact_root/verified.patch"
      - name: Upload verified source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-scanning-operational-fix
          path: ${{ runner.temp }}/code-scanning-operational-fix
          if-no-files-found: error
          retention-days: 1
