name: Org Security Failure Collector

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print planned issue writes without creating/updating issues
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      lookback_hours:
        description: Completed workflow run lookback window
        required: false
        default: "48"

permissions:
  contents: read

concurrency:
  group: org-security-failure-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      LOOKBACK_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_hours || '48' }}
      # Prefer a dedicated least-privilege collector App when configured. Until
      # then, reuse the centrally managed Noema App rather than silently turning
      # this scheduled governance control into a no-op.
      ORG_SECURITY_FAILURE_APP_ID: ${{ vars.ORG_SECURITY_FAILURE_APP_ID || vars.NOEMA_GITHUB_APP_ID }}
      ORG_SECURITY_FAILURE_APP_PRIVATE_KEY: ${{ secrets.ORG_SECURITY_FAILURE_APP_PRIVATE_KEY || secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check GitHub App collector configuration
        id: app-config
        run: |
          set -euo pipefail
          if [[ -n "$ORG_SECURITY_FAILURE_APP_ID" && -n "$ORG_SECURITY_FAILURE_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Org security failure collection cannot run: neither the dedicated collector App nor the centrally managed Noema App has a complete App ID/private-key configuration."
            exit 1
          fi

      - name: Create org installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.ORG_SECURITY_FAILURE_APP_ID }}
          private-key: ${{ env.ORG_SECURITY_FAILURE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-checks: read
          permission-issues: write

      - name: Collect security workflow failures
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.collect_org_security_failures \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --target-repo "$GITHUB_REPOSITORY" \
            --lookback-hours "$LOOKBACK_HOURS"
