name: Org Security Failure Collector

on:
  schedule:
    - cron: "*/30 * * * *"
  # repository_dispatch workflows are always loaded from the default branch.
  # Unlike workflow_dispatch, a caller cannot select a feature-branch workflow
  # definition or collector module to run with the organization App token.
  repository_dispatch:
    types: [collect-org-security-failures]

permissions:
  contents: read

concurrency:
  group: org-security-failure-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DRY_RUN: "false"
      LOOKBACK_HOURS: "48"
      # Prefer a dedicated least-privilege collector App when configured. Until
      # then, reuse the centrally managed Noema App rather than silently turning
      # this scheduled governance control into a no-op.
      ORG_SECURITY_FAILURE_APP_ID: ${{ vars.ORG_SECURITY_FAILURE_APP_ID || vars.NOEMA_GITHUB_APP_ID }}
      ORG_SECURITY_FAILURE_APP_PRIVATE_KEY: ${{ secrets.ORG_SECURITY_FAILURE_APP_PRIVATE_KEY || secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Authorize manual default-branch collection dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_SENDER: ${{ github.event.sender.login || '' }}
          ALLOWED_DISPATCH_ACTOR: ${{ vars.ORG_SECURITY_FAILURE_DISPATCH_ACTOR }}
        run: |
          set -euo pipefail
          if [[ -z "$ALLOWED_DISPATCH_ACTOR" ]] || \
            [[ "$DISPATCH_ACTOR" != "$ALLOWED_DISPATCH_ACTOR" ]] || \
            [[ "$DISPATCH_SENDER" != "$ALLOWED_DISPATCH_ACTOR" ]]; then
            printf '::error::Org security failure collection dispatch rejected actor=%s sender=%s; both must match the configured exact identity.\n' \
              "${DISPATCH_ACTOR:-<empty>}" "${DISPATCH_SENDER:-<empty>}"
            exit 1
          fi
          printf 'Authorized default-branch org security failure collection dispatch by %s.\n' "$DISPATCH_ACTOR"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # schedule and repository_dispatch both bind github.sha to the default
          # branch commit selected when the event was created. Keep that exact
          # reviewed source and do not persist the runner token into Git config.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check GitHub App collector configuration
        id: app-config
        run: |
          set -euo pipefail
          if [[ -n "$ORG_SECURITY_FAILURE_APP_ID" && -n "$ORG_SECURITY_FAILURE_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Org security failure collection cannot run: neither the dedicated collector App nor the centrally managed Noema App has a complete App ID/private-key configuration."
            exit 1
          fi

      - name: Create org installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.ORG_SECURITY_FAILURE_APP_ID }}
          private-key: ${{ env.ORG_SECURITY_FAILURE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-checks: read
          permission-issues: write

      - name: Collect security workflow failures
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.collect_org_security_failures \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --target-repo "$GITHUB_REPOSITORY" \
            --lookback-hours "$LOOKBACK_HOURS"
