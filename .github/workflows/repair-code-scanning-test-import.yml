name: Repair Code Scanning Test Import

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-code-scanning-test-import
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'seonghobae' && github.head_ref == 'feat/code-scanning-analysis-drift-862'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/code-scanning-analysis-drift-862
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-locked tests
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Remove the exact reviewed import
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_code_scanning_coverage_edges.py')
          source = path.read_text(encoding='utf-8')
          old = 'from pathlib import Path\n'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one unused Path import')
          path.write_text(source.replace(old, ''), encoding='utf-8')
          PY
          git diff --check
      - name: Verify full tests
        run: python -m pytest -q
      - name: Commit verified cleanup and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-code-scanning-test-import.yml
          git add tests/test_code_scanning_coverage_edges.py
          git diff --cached --check
          git config user.name 'appguardrail-maintainer'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git commit -m 'test(code-scanning): remove unused Path import'
          git push origin HEAD:feat/code-scanning-analysis-drift-862
