name: Security Process

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  appguardrail-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare CodeGraph CLI
        env:
          CODEGRAPH_PACKAGE: "@colbymchenry/codegraph@0.9.9"
        run: |
          set -euo pipefail
          codegraph_bin="${RUNNER_TEMP}/codegraph-bin"
          mkdir -p "$codegraph_bin"
          cat >"${codegraph_bin}/codegraph" <<SH
          #!/bin/sh
          exec npx -y "$CODEGRAPH_PACKAGE" "\$@"
          SH
          chmod 0755 "${codegraph_bin}/codegraph"
          echo "$codegraph_bin" >>"$GITHUB_PATH"

      - name: Run AppGuardrail deploy gate
        run: |
          set -euo pipefail
          python3 scanner/cli/appguardrail.py scan --codegraph . | tee appguardrail-scan.txt

      - name: Upload AppGuardrail scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appguardrail-scan
          path: appguardrail-scan.txt
          if-no-files-found: error
          retention-days: 7

  trivy-fs:
    # Central Security Scan runs Trivy on PRs; only scan the default branch here.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Use central Trivy scan on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "Central Security Scan runs trivy-fs on pull requests."
          echo "Repository-local Trivy runs on push, schedule, and manual dispatch."

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy FS scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"


      - name: Upload Trivy SARIF artifact
        if: github.event_name != 'pull_request' && always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7
