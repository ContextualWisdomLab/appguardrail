name: Security Process

on:
  push:
    branches: [develop, main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    branches: [develop, main, master]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

# Least-privilege top-level token; write scopes are granted per-job below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appguardrail-scan:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare CodeGraph CLI
        env:
          CODEGRAPH_PACKAGE: "@colbymchenry/codegraph@0.9.9"
        run: |
          set -euo pipefail
          codegraph_bin="${RUNNER_TEMP}/codegraph-bin"
          mkdir -p "$codegraph_bin"
          cat >"${codegraph_bin}/codegraph" <<SH
          #!/bin/sh
          exec npx -y "$CODEGRAPH_PACKAGE" "\$@"
          SH
          chmod 0755 "${codegraph_bin}/codegraph"
          echo "$codegraph_bin" >>"$GITHUB_PATH"

      - name: Run AppGuardrail deploy gate
        run: |
          set -euo pipefail
          python3 scanner/cli/appguardrail.py scan --codegraph . | tee appguardrail-scan.txt

      - name: Upload AppGuardrail scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appguardrail-scan
          path: appguardrail-scan.txt
          if-no-files-found: error
          retention-days: 7
