name: Security Process

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

# Least-privilege top-level token; write scopes are granted per-job below.
permissions:
  contents: read

jobs:
  appguardrail-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare CodeGraph CLI
        env:
          CODEGRAPH_PACKAGE: "@colbymchenry/codegraph@0.9.9"
        run: |
          set -euo pipefail
          codegraph_bin="${RUNNER_TEMP}/codegraph-bin"
          mkdir -p "$codegraph_bin"
          cat >"${codegraph_bin}/codegraph" <<SH
          #!/bin/sh
          exec npx -y "$CODEGRAPH_PACKAGE" "\$@"
          SH
          chmod 0755 "${codegraph_bin}/codegraph"
          echo "$codegraph_bin" >>"$GITHUB_PATH"

      - name: Run AppGuardrail deploy gate
        run: |
          set -euo pipefail
          python3 scanner/cli/appguardrail.py scan --codegraph . | tee appguardrail-scan.txt

      - name: Upload AppGuardrail scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appguardrail-scan
          path: appguardrail-scan.txt
          if-no-files-found: error
          retention-days: 7

  changed-scope:
    name: Classify changed scope for Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -uo pipefail
          # "unknown" until the complete PR file list is verified; only then
          # write true/false. Local trivy-fs runs for anything except "true".
          code=unknown
          if [ -n "${PR}" ] && [ -n "${EXPECTED_FILES}" ]; then
            changed=""
            for attempt in 1 2 3; do
              if changed="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" --jq '.[].filename')" && [ -n "$changed" ]; then
                break
              fi
              changed=""
              sleep $((attempt * 3))
            done
            # GitHub caps /pulls/N/files at 3000 entries; a short list would hide
            # source files behind a doc-only verdict, so require an exact count.
            if [ -n "$changed" ] && [ "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "${EXPECTED_FILES}" ]; then
              code=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.md|*.markdown|*.rst|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.bmp|*.ico|LICENSE|LICENSE.txt|COPYING|COPYING.txt|NOTICE|NOTICE.txt|.github/ISSUE_TEMPLATE/*) ;;
                  *) code=true ;;
                esac
              done <<<"$changed"
            else
              code=unknown
              echo "::notice::changed-scope could not read a complete PR file list; code=unknown, local Trivy fallback will run."
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "changed-scope code=${code}"

  trivy-fs:
    name: trivy-fs (local fallback)
    needs: changed-scope
    # Central Security Scan runs trivy-fs for code-changing PRs to the default
    # branch. Run the local fallback for non-code PRs, plus pushes and PRs to
    # other branches where the central required workflow does not apply. Also
    # run whenever changed-scope failed/was skipped or could not verify the
    # complete file list (code=unknown), so failures lean toward scanning.
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || github.base_ref != github.event.repository.default_branch
      || needs.changed-scope.result != 'success'
      || needs.changed-scope.outputs.code != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: >-
          always()
          && hashFiles('trivy-results.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7
