name: Security Process

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

# Least-privilege top-level token; write scopes are granted per-job below.
permissions:
  contents: read

jobs:
  appguardrail-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODEGRAPH_NO_DOWNLOAD: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare CodeGraph CLI
        env:
          CODEGRAPH_TRUSTED_ROOT: ${{ runner.temp }}/trusted-codegraph
        run: |
          set -euo pipefail
          mkdir -p "$CODEGRAPH_TRUSTED_ROOT"
          cp scripts/ci/codegraph-package/package.json \
            scripts/ci/codegraph-package/package-lock.json \
            "$CODEGRAPH_TRUSTED_ROOT"/
          (
            cd "$CODEGRAPH_TRUSTED_ROOT"
            npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          )
          CODEGRAPH_BIN="${CODEGRAPH_TRUSTED_ROOT}/node_modules/.bin/codegraph"
          test -x "$CODEGRAPH_BIN"
          echo "${CODEGRAPH_TRUSTED_ROOT}/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Run AppGuardrail deploy gate
        run: |
          set -euo pipefail
          python3 scanner/cli/appguardrail.py scan --codegraph . | tee appguardrail-scan.txt

      - name: Upload AppGuardrail scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appguardrail-scan
          path: appguardrail-scan.txt
          if-no-files-found: error
          retention-days: 7

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: >-
          always()
          && hashFiles('trivy-results.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7
