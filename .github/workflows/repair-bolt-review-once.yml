name: Repair Bolt scan optimization once

on:
  push:
    branches:
      - bolt-optimize-stat-calls-15702288289463764944

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bolt-optimize-stat-calls-15702288289463764944
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Apply bounded review fixes
        run: python scripts/ci/repair_bolt_review_once.py
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Verify focused and full contracts
        run: |
          python -m pytest -q tests/test_bolt_review_regressions.py tests/test_language_core.py tests/test_ssrf_protection.py tests/test_appguardrail.py
          python -m pytest -q
          python -m compileall -q appguardrail_core scanner scripts tests
          git diff --check
      - name: Commit verified repair and remove one-shot files
        run: |
          rm .github/workflows/repair-bolt-review-once.yml
          rm scripts/ci/repair_bolt_review_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appguardrail_core/controlplane.py appguardrail_core/language.py scanner/cli/appguardrail.py tests/test_bolt_review_regressions.py tests/test_ssrf_protection.py .jules/bolt.md CHANGELOG.d/877-scan-path-performance.md .github/workflows/repair-bolt-review-once.yml scripts/ci/repair_bolt_review_once.py
          git commit -m "fix(scanner): preserve path contracts and secure redirects"
          git push origin HEAD:bolt-optimize-stat-calls-15702288289463764944
