name: Repair PR 992 runtime DOM XSS regression

on:
  push:
    branches:
      - sentinel-xss-console-11100301982132123366
    paths:
      - .github/workflows/repair-pr-992-runtime-xss.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-992-runtime-xss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/sentinel-xss-console-11100301982132123366'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 8337249ff0d8774d9d5e55c9bebeb4bf771ad118
      BASE_SHA: a68b57d4ccad4f895d7a3d9f909fffbc4653b17e
      TARGET_BRANCH: sentinel-xss-console-11100301982132123366
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sentinel-xss-console-11100301982132123366
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - name: Materialize immutable base test toolchain
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git show "$BASE_SHA:requirements-test.txt" >"${RUNNER_TEMP}/requirements-test.txt"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install immutable test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            -r "${RUNNER_TEMP}/requirements-test.txt"

      - name: Add dependency-free browser regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          import zlib

          encoded = """"""
          payload = zlib.decompress(base64.b64decode("".join(encoded.split())))
          Path("tests/test_console_xss_contract.py").write_bytes(payload)
          PY

      - name: Confirm RED runtime-dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_console_xss_contract.py::test_console_runtime_regression_does_not_ship_browser_automation_dependency \
            >"${RUNNER_TEMP}/console-xss-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/console-xss-red.log"
          test "$status" -ne 0
          grep -F "Playwright is test tooling, not an AppGuardrail runtime dependency" \
            "${RUNNER_TEMP}/console-xss-red.log"

      - name: Restore product dependency boundary and record security change
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:pyproject.toml" >pyproject.toml
          git show "$BASE_SHA:requirements-test.txt" >requirements-test.txt
          git show "$BASE_SHA:uv.lock" >uv.lock
          cat >CHANGELOG.d/992-console-dom-xss.md <<'EOF'
          ## Security

          - Escapes every untrusted scan summary, trend, history, and detail value
            before the control-plane console assigns HTML, including numeric-looking
            pill values and opaque scan identifiers. A dependency-free headless-
            Chromium regression injects script and image-event payloads and proves
            they remain inert text.
          EOF

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome \
            || command -v google-chrome-stable \
            || command -v chromium \
            || command -v chromium-browser
          python -m pytest -q tests/test_console_xss_contract.py
          python -m pytest -q tests
          python -m compileall -q appguardrail_core scanner tests
          git diff --check

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/repair-pr-992-runtime-xss.yml
          git add -A
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(console): verify hostile values without runtime dependencies"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
