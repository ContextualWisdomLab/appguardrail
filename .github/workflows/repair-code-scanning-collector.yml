name: Repair Code Scanning Collector

on:
  push:
    branches: [feat/code-scanning-analysis-drift-862]
    paths: [.github/workflows/repair-code-scanning-collector.yml]

permissions:
  contents: write

concurrency:
  group: repair-code-scanning-collector
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'seonghobae' && github.ref == 'refs/heads/feat/code-scanning-analysis-drift-862'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/code-scanning-analysis-drift-862
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-locked tests
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Apply exact reviewed cleanup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/collect_code_scanning_drift.py')
          source = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'import urllib.error\nfrom dataclasses import asdict, dataclass\n',
                  'import urllib.error\nimport urllib.request\nfrom dataclasses import dataclass\n',
              ),
              (
                  '        self.opener = self.opener.__class__() if False else None\n'
                  '        import urllib.request\n\n'
                  '        self.opener = urllib.request.build_opener(NoRedirect)\n',
                  '        self.opener = urllib.request.build_opener(NoRedirect)\n',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one reviewed replacement: {old!r}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
      - name: Verify focused and full tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_code_scanning_drift_transport_edges.py tests/test_code_scanning_drift_collector.py
          python -m pytest -q
      - name: Commit verified cleanup and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-code-scanning-collector.yml
          git add scripts/ci/collect_code_scanning_drift.py
          git diff --cached --check
          git config user.name 'appguardrail-maintainer'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git commit -m 'fix(code-scanning): remove constant and unused imports'
          git push origin HEAD:feat/code-scanning-analysis-drift-862
