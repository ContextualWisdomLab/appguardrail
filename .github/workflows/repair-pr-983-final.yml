name: Repair PR 983 command-injection detector

on:
  push:
    branches:
      - sentinel-fix-python-command-injection-regex-727217014950515043
    paths:
      - .github/workflows/repair-pr-983-final.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-983-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/sentinel-fix-python-command-injection-regex-727217014950515043'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 4b5d402c5265dfbc3444b0932a246ba6802d13d2
      TARGET_BRANCH: sentinel-fix-python-command-injection-regex-727217014950515043
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install immutable test toolchain
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Add independent RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          tests_path = Path('tests/test_appguardrail.py')
          tests = tests_path.read_text(encoding='utf-8')
          combined = '''        "cmd_injection.py": {
              "content": "os.system(user_input)\\nos.popen(cmd)\\nsubprocess.call(cmd, shell=True)\\n",
              "ids": {"python-command-injection"},
          },
          '''
          if tests.count(combined) == 1:
              tests = tests.replace(combined, '', 1)
          elif combined in tests:
              raise SystemExit('combined command-injection fixture is duplicated')

          marker = 'def test_python_shell_spawning_apis_are_detected_independently('
          addition = dedent('''

          @pytest.mark.parametrize(
              ("filename", "source"),
              [
                  pytest.param(
                      "os_system.py",
                      "os.system(user_input)\\n",
                      id="os-system",
                  ),
                  pytest.param(
                      "os_popen.py",
                      "os.popen(command)\\n",
                      id="os-popen",
                  ),
                  pytest.param(
                      "subprocess_shell.py",
                      "subprocess.call(command, shell=True)\\n",
                      id="subprocess-shell",
                  ),
                  pytest.param(
                      "subprocess_nested_shell.py",
                      "subprocess.call(build_command(user_input), shell=True)\\n",
                      id="nested-subprocess-shell",
                  ),
              ],
          )
          def test_python_shell_spawning_apis_are_detected_independently(
              tmp_path: Path,
              filename: str,
              source: str,
          ) -> None:
              """Detect each Python shell-spawning API without shared-fixture masking."""
              target = tmp_path / filename
              target.write_text(source, encoding="utf-8")

              findings = _scan_file(target, tmp_path)

              assert [item["rule_id"] for item in findings].count(
                  "python-command-injection"
              ) == 1


          def test_python_shell_spawning_rule_describes_both_shell_mechanisms(
              tmp_path: Path,
          ) -> None:
              """Explain implicit os shells separately from subprocess shell=True."""
              target = tmp_path / "os_system.py"
              target.write_text("os.system(user_input)\\n", encoding="utf-8")

              findings = [
                  item
                  for item in _scan_file(target, tmp_path)
                  if item["rule_id"] == "python-command-injection"
              ]

              assert len(findings) == 1
              assert "os.system/os.popen execute through a shell" in findings[0]["message"]
              assert "subprocess shell=True" in findings[0]["message"]


          @pytest.mark.parametrize(
              "source",
              [
                  "subprocess.call(command)\\n",
                  "subprocess.call(command, shell=False)\\n",
              ],
          )
          def test_python_shell_spawning_rule_ignores_non_shell_subprocess_calls(
              tmp_path: Path,
              source: str,
          ) -> None:
              """Do not classify ordinary subprocess calls as shell execution."""
              target = tmp_path / "subprocess_safe.py"
              target.write_text(source, encoding="utf-8")

              findings = _scan_file(target, tmp_path)

              assert "python-command-injection" not in {
                  item["rule_id"] for item in findings
              }
          ''')
          if tests.count(marker) == 0:
              tests = tests.rstrip() + addition + '\n'
          elif tests.count(marker) != 1:
              raise SystemExit('independent command-injection regression marker is duplicated')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          set +e
          python -m pytest -q tests/test_appguardrail.py \
            -k 'python_shell_spawning_apis_are_detected_independently or python_shell_spawning_rule_describes_both_shell_mechanisms' \
            >"${RUNNER_TEMP}/red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/red.log"
          test "$status" -ne 0
          grep -Eq 'nested-subprocess-shell|describes_both_shell_mechanisms' "${RUNNER_TEMP}/red.log"

      - name: Apply minimum GREEN implementation and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path('scanner/cli/appguardrail.py')
          scanner = scanner_path.read_text(encoding='utf-8')
          old_pattern = r'''            r"(?i)(?:os\.(?:system|popen)\s*\(|subprocess\.(?:Popen|run|call|check_call|check_output)\s*\([^)]*shell\s*=\s*True)"
          '''
          new_pattern = r'''            r"(?is)(?:\bos\.(?:system|popen)\s*\(|\bsubprocess\.(?:Popen|run|call|check_call|check_output)\s*\((?:[^()]|\([^()]*\)){0,1200}\bshell\s*=\s*True)"
          '''
          if scanner.count(old_pattern) != 1:
              raise SystemExit('python command-injection pattern boundary drifted')
          scanner = scanner.replace(old_pattern, new_pattern, 1)

          old_message = (
              '        "message": "Potential Command Injection detected: shell=True used in '
              'Python subprocess/os command. [OWASP A03:2021 - Injection]",\n'
          )
          new_message = (
              '        "message": "Potential command injection sink detected: '
              'os.system/os.popen execute through a shell, and subprocess shell=True '
              'invokes a shell. Avoid shell execution, validate untrusted input, and use '
              'argument arrays where possible. [OWASP A03:2021 - Injection]",\n'
          )
          if scanner.count(old_message) != 1:
              raise SystemExit('python command-injection message boundary drifted')
          scanner = scanner.replace(old_message, new_message, 1)
          scanner_path.write_text(scanner, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = '### 보안\n'
          entry = (
              '- Python 명령 주입 탐지가 `os.system`·`os.popen`의 암묵적 셸 실행과 '
              '`subprocess(..., shell=True)`를 정확히 구분해 설명하고, 중첩된 명령 생성 '
              '호출 뒤의 `shell=True`까지 탐지하도록 보강했습니다. 각 API와 비셸 '
              '`subprocess` 음성 사례를 독립 회귀로 검증합니다.\n'
          )
          if entry not in changelog:
              if changelog.count(anchor) != 1:
                  raise SystemExit('CHANGELOG security section boundary drifted')
              changelog = changelog.replace(anchor, anchor + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_appguardrail.py \
            -k 'python_shell_spawning or scan_file_detects_strix_derived_patterns'
          python -m pytest -q
          python -m compileall -q scanner appguardrail_core tests
          git diff --check
          test "$(git status --porcelain | grep -v '^ D .github/workflows/repair-pr-983-final.yml$' | wc -l)" -ge 3

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-983-final.yml
          git add -A
          git config user.name "CWL Verified Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(scanner): harden Python shell command detection"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
