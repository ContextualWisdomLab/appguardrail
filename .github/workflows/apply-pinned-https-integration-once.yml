name: Apply pinned HTTPS integration once

on:
  push:
    branches:
      - security/pinned-control-plane-892

permissions:
  contents: write

concurrency:
  group: apply-pinned-https-integration-once
  cancel-in-progress: true

jobs:
  apply-test-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/pinned-control-plane-892
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply reviewed integration patch
        run: python scripts/ci/apply_pinned_https_integration_once.py

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Verify focused, exact coverage, and repository contracts
        run: |
          python -m pytest -q \
            tests/test_pinned_https_resolution.py \
            tests/test_pinned_https_redirects.py \
            tests/test_pinned_https_cli_integration.py \
            tests/test_pinned_https_validation_edges.py \
            tests/test_pinned_https_coverage_edges.py \
            tests/test_pinned_https_release_contract.py \
            tests/test_ssrf_protection.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/pinned_https.py \
            --test tests/test_pinned_https_resolution.py \
            --test tests/test_pinned_https_redirects.py \
            --test tests/test_pinned_https_cli_integration.py \
            --test tests/test_pinned_https_validation_edges.py \
            --test tests/test_pinned_https_coverage_edges.py \
            --test tests/test_pinned_https_release_contract.py
          python -m pytest -q
          python -m compileall -q appguardrail_core scanner scripts tests
          git diff --check

      - name: Commit verified integration and remove one-shot files
        run: |
          rm .github/workflows/apply-pinned-https-integration-once.yml
          rm scripts/ci/apply_pinned_https_integration_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            appguardrail_core/__init__.py \
            appguardrail_core/pinned_https.py \
            scanner/cli/appguardrail.py \
            tests/test_pinned_https_validation_edges.py \
            tests/test_ssrf_protection.py \
            .github/workflows/apply-pinned-https-integration-once.yml \
            scripts/ci/apply_pinned_https_integration_once.py
          git commit -m "feat(security): integrate DNS-pinned scan delivery"
          git push origin HEAD:security/pinned-control-plane-892
