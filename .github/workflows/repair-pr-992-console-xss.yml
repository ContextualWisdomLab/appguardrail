name: Repair PR 992 console DOM XSS regression

on:
  push:
    branches:
      - sentinel-xss-console-11100301982132123366
    paths:
      - .github/workflows/repair-pr-992-console-xss.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-992-console-xss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/sentinel-xss-console-11100301982132123366'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 9e060befe8e17d61d6b1427c50c0e3c04a798fe9
      TARGET_BRANCH: sentinel-xss-console-11100301982132123366
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sentinel-xss-console-11100301982132123366
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install immutable test toolchain
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Confirm RED source contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_console_xss_contract.py::test_console_escapes_summary_and_history_values_before_inner_html \
            >"${RUNNER_TEMP}/console-xss-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/console-xss-red.log"
          test "$status" -ne 0
          grep -F 'style="background:${color}">${esc(n)}</span>' \
            "${RUNNER_TEMP}/console-xss-red.log"

      - name: Escape the remaining pill interpolation and record the fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          console_path = Path("scanner/dashboard/console.html")
          console = console_path.read_text(encoding="utf-8")
          old = 'function pill(n,color){return n>0?`<span class="pill" style="background:${color}">${n}</span>`:`<span class="muted">0</span>`;}'
          new = 'function pill(n,color){return n>0?`<span class="pill" style="background:${color}">${esc(n)}</span>`:`<span class="muted">0</span>`;}'
          if console.count(old) != 1:
              raise SystemExit("pill escaping boundary drifted")
          console_path.write_text(console.replace(old, new, 1), encoding="utf-8")

          fragment = Path("CHANGELOG.d/992-console-dom-xss.md")
          if fragment.exists():
              raise SystemExit("console DOM XSS changelog fragment already exists")
          fragment.write_text(
              "## Security\n\n"
              "- Escapes every untrusted scan summary, trend, history, and detail value "
              "before the control-plane console assigns HTML, including numeric-looking "
              "pill values and opaque scan identifiers. A headless-Chromium regression "
              "injects script and image-event payloads and proves they remain inert text.\n",
              encoding="utf-8",
          )
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python -m pytest -q tests/test_console_xss_contract.py
          python -m pytest -q tests
          python -m compileall -q appguardrail_core scanner tests
          git diff --check

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-992-console-xss.yml
          git add -A
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(console): prove hostile scan values remain inert"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
