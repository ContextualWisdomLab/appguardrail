name: Repair PR 983 Python shell AST detector

on:
  push:
    branches:
      - sentinel-fix-python-command-injection-regex-727217014950515043
    paths:
      - .github/workflows/repair-pr-983-python-ast.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-983-python-ast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/sentinel-fix-python-command-injection-regex-727217014950515043'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: b0dfcb6449eae02bab5a77c773b49c131850ebe9
      TARGET_BRANCH: sentinel-fix-python-command-injection-regex-727217014950515043
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install immutable test toolchain
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Add realistic RED regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_python_command_injection_ast.py <<'PY'
          """Behavior contracts for Python shell-spawning call detection."""

          from pathlib import Path

          import pytest

          from scanner.cli.appguardrail import _scan_file


          @pytest.mark.parametrize(
              ("case_name", "source", "expected_line"),
              [
                  (
                      "implicit-os-system",
                      "import os\nos.system(user_input)\n",
                      2,
                  ),
                  (
                      "implicit-os-popen",
                      "import os\nos.popen(command)\n",
                      2,
                  ),
                  (
                      "deeply-nested-subprocess",
                      "import subprocess\nsubprocess.run(build(one(two(user_input))), shell=True)\n",
                      2,
                  ),
                  (
                      "subprocess-module-alias",
                      "import subprocess as sp\nsp.check_output(command, shell=True)\n",
                      2,
                  ),
                  (
                      "subprocess-function-alias",
                      "from subprocess import check_call as invoke\ninvoke(command, shell=True)\n",
                      2,
                  ),
                  (
                      "os-module-alias",
                      "import os as operating_system\noperating_system.system(user_input)\n",
                      2,
                  ),
                  (
                      "os-function-alias",
                      "from os import popen as open_pipe\nopen_pipe(command)\n",
                      2,
                  ),
              ],
          )
          def test_python_shell_calls_are_found_from_parsed_call_structure(
              tmp_path: Path,
              case_name: str,
              source: str,
              expected_line: int,
          ) -> None:
              """Detect deep arguments and import aliases without regex depth limits."""
              target = tmp_path / f"{case_name}.py"
              target.write_text(source, encoding="utf-8")

              matches = [
                  finding
                  for finding in _scan_file(target, tmp_path)
                  if finding["rule_id"] == "python-command-injection"
              ]

              assert len(matches) == 1
              assert matches[0]["line"] == expected_line
              assert matches[0]["source"] == "appguardrail-python-ast"


          @pytest.mark.parametrize(
              "source",
              [
                  "import subprocess\nsubprocess.run(['id'])\n",
                  "import subprocess\nsubprocess.call(command, shell=False)\n",
                  "import subprocess\nshell_enabled = True\nsubprocess.run(command, shell=shell_enabled)\n",
                  "runner.run(command, shell=True)\n",
                  "text = 'os.system(user_input)'\n# subprocess.run(command, shell=True)\n",
              ],
          )
          def test_python_shell_detector_ignores_non_authoritative_shapes(
              tmp_path: Path,
              source: str,
          ) -> None:
              """Avoid strings, comments, unrelated methods, and nonliteral shell flags."""
              target = tmp_path / "safe_shape.py"
              target.write_text(source, encoding="utf-8")

              rule_ids = {
                  finding["rule_id"] for finding in _scan_file(target, tmp_path)
              }

              assert "python-command-injection" not in rule_ids


          def test_python_shell_detector_fails_safely_on_incomplete_source(
              tmp_path: Path,
          ) -> None:
              """Keep scanning malformed work-in-progress files without crashing."""
              target = tmp_path / "incomplete.py"
              target.write_text(
                  "import subprocess\nsubprocess.run(command, shell=True\n",
                  encoding="utf-8",
              )

              assert isinstance(_scan_file(target, tmp_path), list)
          PY

          set +e
          python -m pytest -q tests/test_python_command_injection_ast.py \
            >"${RUNNER_TEMP}/python-shell-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/python-shell-red.log"
          test "$status" -ne 0
          grep -Eq 'deeply-nested-subprocess|subprocess-module-alias|os-module-alias' \
            "${RUNNER_TEMP}/python-shell-red.log"

      - name: Apply minimum AST-backed GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          scanner_path = Path("scanner/cli/appguardrail.py")
          scanner = scanner_path.read_text(encoding="utf-8")

          import_anchor = "import argparse\n"
          if scanner.count(import_anchor) != 1 or "import ast\n" in scanner:
              raise SystemExit("AST import boundary drifted")
          scanner = scanner.replace(import_anchor, import_anchor + "import ast\n", 1)

          old_rule = '''    {
              "id": "python-command-injection",
              "pattern": re.compile(
                  r"(?is)(?:\\bos\\.(?:system|popen)\\s*\\(|\\bsubprocess\\.(?:Popen|run|call|check_call|check_output)\\s*\\((?:[^()]|\\([^()]*\\)){0,1200}\\bshell\\s*=\\s*True)"
              ),
              "severity": "CRITICAL",
              "message": "Potential command injection sink detected: os.system/os.popen execute through a shell, and subprocess shell=True invokes a shell. Avoid shell execution, validate untrusted input, and use argument arrays where possible. [OWASP A03:2021 - Injection]",
              "extensions": [".py"],
          },
          '''
          if scanner.count(old_rule) != 1:
              raise SystemExit("legacy Python command-injection regex boundary drifted")
          scanner = scanner.replace(old_rule, "", 1)

          helper = dedent(
              '''
              _PYTHON_IMPLICIT_SHELL_APIS = frozenset({"popen", "system"})
              _PYTHON_SUBPROCESS_SHELL_APIS = frozenset(
                  {"Popen", "call", "check_call", "check_output", "run"}
              )
              _PYTHON_COMMAND_INJECTION_MESSAGE = (
                  "Potential command injection sink detected: os.system/os.popen execute "
                  "through a shell, and subprocess shell=True invokes a shell. Avoid shell "
                  "execution, validate untrusted input, and use argument arrays where "
                  "possible. [OWASP A03:2021 - Injection]"
              )


              def _python_command_injection_findings(
                  content: str,
                  file_path: Path,
                  context: ScanPathContext,
              ):
                  """Find Python shell-spawning calls from parsed call structure.

                  AST parsing removes regex nesting limits and ignores comments and string
                  literals. Only literal ``shell=True`` is admitted for subprocess APIs;
                  dynamic shell flags remain outside this high-confidence rule.
                  """
                  try:
                      tree = ast.parse(content)
                  except (SyntaxError, TypeError, ValueError, RecursionError):
                      return []

                  os_module_aliases = {"os"}
                  subprocess_module_aliases = {"subprocess"}
                  os_function_aliases: set[str] = set()
                  subprocess_function_aliases: set[str] = set()

                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          for alias in node.names:
                              if alias.name == "os":
                                  os_module_aliases.add(alias.asname or alias.name)
                              elif alias.name == "subprocess":
                                  subprocess_module_aliases.add(alias.asname or alias.name)
                      elif isinstance(node, ast.ImportFrom) and node.level == 0:
                          if node.module == "os":
                              for alias in node.names:
                                  if alias.name in _PYTHON_IMPLICIT_SHELL_APIS:
                                      os_function_aliases.add(alias.asname or alias.name)
                          elif node.module == "subprocess":
                              for alias in node.names:
                                  if alias.name in _PYTHON_SUBPROCESS_SHELL_APIS:
                                      subprocess_function_aliases.add(
                                          alias.asname or alias.name
                                      )

                  relative_path = _sanitize_terminal_output(
                      _display_path(context.relative_candidate(file_path))
                  )
                  source_lines = content.splitlines()
                  findings = []

                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue

                      function = node.func
                      implicit_shell = (
                          isinstance(function, ast.Attribute)
                          and isinstance(function.value, ast.Name)
                          and function.value.id in os_module_aliases
                          and function.attr in _PYTHON_IMPLICIT_SHELL_APIS
                      ) or (
                          isinstance(function, ast.Name)
                          and function.id in os_function_aliases
                      )
                      subprocess_shell = (
                          isinstance(function, ast.Attribute)
                          and isinstance(function.value, ast.Name)
                          and function.value.id in subprocess_module_aliases
                          and function.attr in _PYTHON_SUBPROCESS_SHELL_APIS
                      ) or (
                          isinstance(function, ast.Name)
                          and function.id in subprocess_function_aliases
                      )

                      if subprocess_shell:
                          shell_keyword = next(
                              (
                                  keyword
                                  for keyword in node.keywords
                                  if keyword.arg == "shell"
                              ),
                              None,
                          )
                          if not (
                              shell_keyword is not None
                              and isinstance(shell_keyword.value, ast.Constant)
                              and shell_keyword.value.value is True
                          ):
                              continue
                      elif not implicit_shell:
                          continue

                      line_number = max(getattr(node, "lineno", 1), 1)
                      snippet = (
                          source_lines[line_number - 1].strip()[:120]
                          if line_number <= len(source_lines)
                          else "Python shell-spawning call"
                      )
                      findings.append(
                          _build_finding(
                              "appguardrail-python-ast",
                              "python-command-injection",
                              "CRITICAL",
                              _PYTHON_COMMAND_INJECTION_MESSAGE,
                              relative_path,
                              line_number,
                              snippet,
                          )
                      )

                  findings.sort(
                      key=lambda finding: (
                          finding["line"],
                          finding["snippet"],
                      )
                  )
                  return findings


              '''
          )
          function_anchor = "def _scan_file(\n"
          if scanner.count(function_anchor) != 1 or "_python_command_injection_findings" in scanner:
              raise SystemExit("Python AST helper insertion boundary drifted")
          scanner = scanner.replace(function_anchor, helper + function_anchor, 1)

          old_rule_gate = '''    if not applicable_rules:
              return findings
          '''
          new_rule_gate = '''    if not applicable_rules and ext != ".py":
              return findings
          '''
          if scanner.count(old_rule_gate) != 1:
              raise SystemExit("applicable-rule gate boundary drifted")
          scanner = scanner.replace(old_rule_gate, new_rule_gate, 1)

          old_content_boundary = '''            if not content:
                      return findings
                  count_newlines = content.count
          '''
          new_content_boundary = '''            if not content:
                      return findings
                  if ext == ".py":
                      findings.extend(
                          _python_command_injection_findings(
                              content,
                              file_path,
                              context,
                          )
                      )
                  if not applicable_rules:
                      return findings
                  count_newlines = content.count
          '''
          if scanner.count(old_content_boundary) != 1:
              raise SystemExit("file-content scan boundary drifted")
          scanner = scanner.replace(old_content_boundary, new_content_boundary, 1)
          scanner_path.write_text(scanner, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old_changelog = (
              "- Python 명령 주입 탐지가 `os.system`·`os.popen`의 암묵적 셸 실행과 "
              "`subprocess(..., shell=True)`를 정확히 구분해 설명하고, 중첩된 명령 "
              "생성 호출 뒤의 `shell=True`까지 탐지하도록 보강했습니다. 각 API와 "
              "비셸 `subprocess` 음성 사례를 독립 회귀로 검증합니다.\n"
          )
          new_changelog = (
              "- Python 명령 주입 탐지를 AST 기반으로 전환해 임의 깊이의 중첩 인자와 "
              "`os`·`subprocess` 모듈/함수 별칭을 판별합니다. 주석·문자열·무관한 "
              "동명 메서드·비셸 호출은 제외하면서 `os.system`·`os.popen`의 암묵적 "
              "셸 실행과 리터럴 `subprocess(..., shell=True)`를 독립 회귀로 검증합니다.\n"
          )
          if changelog.count(old_changelog) != 1:
              raise SystemExit("command-injection changelog boundary drifted")
          changelog_path.write_text(
              changelog.replace(old_changelog, new_changelog, 1),
              encoding="utf-8",
          )
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_python_command_injection_ast.py \
            tests/test_appguardrail.py \
            -k 'python_shell or scan_file_detects_strix_derived_patterns'
          python -m pytest -q tests
          python -m ruff check \
            scanner/cli/appguardrail.py \
            tests/test_python_command_injection_ast.py \
            tests/test_appguardrail.py
          python -m compileall -q appguardrail_core scanner tests
          git diff --check

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-983-python-ast.yml
          git add -A
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sast): parse Python shell-spawning calls"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
