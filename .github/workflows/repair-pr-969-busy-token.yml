name: Repair PR 969 shared busy token

on:
  push:
    branches:
      - palette-proxy-file-input-11879307227217674529
    paths:
      - .github/workflows/repair-pr-969-busy-token.yml

permissions:
  contents: read

concurrency:
  group: repair-pr-969-busy-token-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/appguardrail' &&
      github.ref == 'refs/heads/palette-proxy-file-input-11879307227217674529'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 0a1ef216eeab4fee1a11fdab1ed488985bbb297a
      TARGET_BRANCH: palette-proxy-file-input-11879307227217674529
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact single-writer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git status --porcelain)" = ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install immutable test toolchain
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Confirm RED token contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_dashboard_file_upload_contract.py::test_header_upload_proxy_is_native_tokenized_and_state_perceivable \
            >"${RUNNER_TEMP}/upload-token-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/upload-token-red.log"
          test "$status" -ne 0
          grep -F -- '--busy-opacity:.6;' "${RUNNER_TEMP}/upload-token-red.log"

      - name: Reuse the shared busy opacity token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scanner/dashboard/index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    --radius:12px;\n": "    --radius:12px; --busy-opacity:.6;\n",
              ".upload-action:disabled{opacity:0.6;cursor:not-allowed}": (
                  ".upload-action:disabled{opacity:var(--busy-opacity);cursor:not-allowed}"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"dashboard busy-token boundary drifted: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_dashboard_file_upload_contract.py
          python -m pytest -q tests
          python -m compileall -q appguardrail_core scanner tests
          git diff --check

      - name: Publish verified repair and remove temporary authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-969-busy-token.yml
          git add -A
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): reuse shared busy opacity token"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
